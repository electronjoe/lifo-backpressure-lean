cstar * Real.exp (-m) : ℝ) : EReal).", "why": "Exact correspondence, using strict inequality D + K * m < |pol.queue τ ω j - γstar j| and probability measure μ."}], "counts": {"agrees": 5, "stronger": 0, "nuance": 2, "gap": 2}, "paper_spans": [{"text": "Under the "}, {"text": "Section III–V stochastic network model", "case": "C1", "polarity": "gap"}, {"text": " and "}, {"text": "Backpressure (FIFO or LIFO)", "case": "C3", "polarity": "nuance"}, {"text": " (with "}, {"text": "control parameter $V$ — lower bound $V \\ge 1$ left implicit here", "case": "C7", "polarity": "gap"}, {"text": "), suppose the "}, {"text": "dual optimum $\\boldsymbol{\\gamma}_V^*$ of $g(\\boldsymbol{\\gamma})$", "case": "C2", "polarity": "agrees"}, {"text": " is "}, {"text": "unique", "case": "C4", "polarity": "agrees"}, {"text": ", "}, {"text": "Slater $\\eta$-slackness (Eq. 2)", "case": "C5", "polarity": "nuance"}, {"text": " holds, and "}, {"text": "$g(\\boldsymbol{\\gamma}_V^*) \\ge g(\\boldsymbol{\\gamma}) + L\\|\\boldsymbol{\\gamma}_V^* - \\boldsymbol{\\gamma}\\|$ for $V$-independent $L > 0$", "case": "C6", "polarity": "agrees"}, {"text": ". Then "}, {"text": "there exist $V$-independent constants $D, K, c^* = \\Theta(1)$", "case": "C8", "polarity": "agrees"}, {"text": " such that for all $m \\ge 0$, "}, {"text": "$\\mathcal{P}^{(r)}(D, Km) \\le c^* e^{-m}$", "case": "C9", "polarity": "agrees"}, {"text": "."}], "lean_spans": [{"text": "For any "}, {"text": "`NetworkModel M` ($f \\in [0, \\delta_{\\max}]$, nonempty compact actions)", "case": "C1", "polarity": "gap"}, {"text": ", "}, {"text": "finite-mixture `HasSlackness η`", "case": "C5", "polarity": "nuance"}, {"text": ", and "}, {"text": "$V$-independent $L > 0$ (`DualPolyhedral` in Euclidean norm)", "case": "C6", "polarity": "agrees"}, {"text": ": "}, {"text": "there exist $D, K, c^* > 0$ quantified outside $\\forall V, \\gamma^*, \\Omega, \\mu, m$", "case": "C8", "polarity": "agrees"}, {"text": " such that for all "}, {"text": "$1 \\le V$ (explicitly assumed)", "case": "C7", "polarity": "gap"}, {"text": ", every "}, {"text": "dual optimum of separable `dual M V`", "case": "C2", "polarity": "agrees"}, {"text": " satisfying "}, {"text": "`IsUniqueDualOpt V γstar`", "case": "C4", "polarity": "agrees"}, {"text": ", and every "}, {"text": "deterministic-tie-breaking `FollowsBackpressure V` policy", "case": "C3", "polarity": "nuance"}, {"text": ", for all $m \\ge 0$: "}, {"text": "`deviationProb pol γstar D (K * m)` $\\le c^* e^{-m}$ in `EReal`", "case": "C9", "polarity": "agrees"}, {"text": "."}]}, "defaults": [{"construct": "ENNReal.ofReal", "type": "", "constant": "LifoBackpressure.Statements.NetworkModel.MarkovProcess.mk", "file": "Statements/SystemModel.lean", "line": 124, "meaning": "", "status": "justified", "explanation": "In MarkovProcess.mk, ENNReal.ofReal is only applied to M.P s s', which is guaranteed nonnegative by M.P_nonneg."}, {"construct": "iInf", "type": "", "constant": "LifoBackpressure.Statements.NetworkModel.dualState", "file": "Statements/SystemModel.lean", "line": 102, "meaning": "", "status": "justified", "explanation": "In NetworkModel.dualState, iInf over Action s is taken on a nonempty compact space (M.actionNonempty, M.actionCompact) of a continuous bounded function, so the range is nonempty and bounded below and the infimum is genuine."}, {"construct": "Real.sqrt", "type": "", "constant": "LifoBackpressure.Statements.NetworkModel.eucDist", "file": "Statements/SystemModel.lean", "line": 98, "meaning": "", "status": "justified", "explanation": "In NetworkModel.eucDist, Real.sqrt is applied to ∑ j : Fin r, (a j - b j) ^ 2, which is always nonnegative."}, {"construct": "ENNReal.toReal", "type": "", "constant": "LifoBackpressure.Statements.deviationProb", "file": "Statements/ExponentialAttraction.lean", "line": 14, "meaning": "", "status": "justified", "explanation": "In deviationProb, μ is a probability measure ([IsProbabilityMeasure μ]), so μ {...} <= 1 < ⊤ and ENNReal.toReal never hits the ⊤.toReal = 0 default."}, {"construct": "HDiv.hDiv", "type": "EReal", "constant": "LifoBackpressure.Statements.deviationProb", "file": "Statements/ExponentialAttraction.lean", "line": 14, "meaning": "", "status": "justified", "explanation": "In deviationProb, EReal division 1 / t at t = 0 does not affect Filter.limsup along Filter.atTop, since every t >= 1 has nonzero denominator."}], "lamport": {"provenance": "Follows Theorem 1 & Appendices A–B of companion paper arXiv:0904.3795v1 (`delay_reduction_tr_v8_Markovian.tex`, L354–531 & L1120–1333).", "statement": "Under $V \\ge 1$, unique $\\boldsymbol{\\gamma}_V^*$, $\\eta$-slackness, and $g(\\boldsymbol{\\gamma}_V^*) \\ge g(\\boldsymbol{\\gamma}) + L\\|\\boldsymbol{\\gamma}_V^* - \\boldsymbol{\\gamma}\\|$ ($L>0$ independent of $V$), there exist $V$-independent $D, K, c^* > 0$ such that $\\mathcal{P}^{(r)}(D, Km) \\le c^* e^{-m}$ for all $m \\ge 0$.", "groups": [{"id": "⟨1⟩1", "title": "One-slot squared-distance inequality (Companion App. A, Lemma 2)", "steps": [{"id": "⟨1⟩1.⟨2⟩1", "title": "Non-expansiveness of $[\\cdot]^+$ projection onto $\\mathbb{R}_+^r$", "body": "With $B = \\sqrt{r}\\delta_{\\max}$, non-expansiveness of projection onto $\\mathbb{R}_+^r$ yields $\\|q(t+1) - \\gamma_V^*\\|^2 \\le \\|q(t) - \\gamma_V^*\\|^2 + 2B^2 - 2(\\gamma_V^* - q(t))^\\top (A(t) - \\mu(t))$.", "uses": ["Routine.BackpressureDrift.sum_dist_sq_drift"], "lean": "Routine.BackpressureDrift.sum_dist_sq_drift"}, {"id": "⟨1⟩1.⟨2⟩2", "title": "Backpressure produces a subgradient of $g_{S(t)}$", "body": "By Eq. (6) optimality, $A(t) - \\mu(t)$ is a subgradient of $g_{S(t)}(V, \\cdot)$ at $q(t)$, so $(\\gamma_V^* - q(t))^\\top (A(t) - \\mu(t)) \\ge g_{S(t)}(\\gamma_V^*) - g_{S(t)}(q(t))$.", "uses": ["FollowsBackpressure"], "lean": "Proofs.ExponentialAttraction.bp_subgradient_bound"}]}, {"id": "⟨1⟩2", "title": "$T_\\nu$-slot expected quadratic drift (Companion App. A, Lemma 1)", "steps": [{"id": "⟨1⟩2.⟨2⟩1", "title": "$V$-independent convergent mixing interval $T_\\nu$", "body": "Choose $\\nu = L/(2B) > 0$. By geometric mixing of $S(t)$, there exists a $V$-independent horizon $T_\\nu \\ge 1$ such that $\\sum_s |\\pi_s - \\frac{1}{T_\\nu}\\sum_{\\tau=0}^{T_\\nu-1} P^\\tau(s_0, s)| \\le \\nu$ for every $s_0$.", "uses": ["Routine.MarkovMixing.exists_convergent_interval"], "lean": "Routine.MarkovMixing.exists_convergent_interval"}, {"id": "⟨1⟩2.⟨2⟩2", "title": "Multi-slot conditional quadratic drift", "body": "Summing Step ⟨1⟩1 over $\\tau = 0, \\dots, T_\\nu - 1$, using $B$-Lipschitzness of $g_s$ and $\\|q(t+\\tau) - q(t)\\| \\le \\tau B$, gives $\\mathbb{E}[\\|q(t+T_\\nu)-\\gamma_V^*\\|^2 \\mid \\mathcal{H}(t)] \\le \\|q(t)-\\gamma_V^*\\|^2 + (T_\\nu^2+T_\\nu)B^2 - 2T_\\nu(g(\\gamma_V^*)-g(q(t))) + 2T_\\nu \\nu B \\|\\gamma_V^*-q(t)\\|$.", "uses": ["⟨1⟩1.⟨2⟩1", "⟨1⟩1.⟨2⟩2", "⟨1⟩2.⟨2⟩1"], "lean": "Proofs.ExponentialAttraction.multi_slot_dist_sq_drift"}]}, {"id": "⟨1⟩3", "title": "Linear negative drift outside radius $D$", "steps": [{"id": "⟨1⟩3.⟨2⟩1", "title": "Polyhedral growth + Jensen yield strict contraction", "body": "Set $\\eta_d := T_\\nu L / 4 > 0$ and $D := \\max\\!\\left(\\frac{(T_\\nu^2+T_\\nu)B^2 - \\eta_d^2}{2T_\\nu(L - \\eta_d/T_\\nu - B\\nu)}, \\eta_d\\right)$ (all $V$-independent). Applying $g(\\gamma_V^*) - g(q(t)) \\ge L\\|\\gamma_V^* - q(t)\\|$ and Jensen's inequality shows that whenever $Y(t) := \\|q(t) - \\gamma_V^*\\| \\ge D$, $\\mathbb{E}[Y(t+T_\\nu) \\mid \\mathcal{H}(t)] \\le Y(t) - \\eta_d$.", "uses": ["⟨1⟩2.⟨2⟩2", "DualPolyhedral"], "lean": "Proofs.ExponentialAttraction.linear_negative_drift"}]}, {"id": "⟨1⟩4", "title": "Exponential Lyapunov drift & Markov's inequality (Q.E.D.)", "steps": [{"id": "⟨1⟩4.⟨2⟩1", "title": "Padé exponential bound on $\\tilde{Y}(t) = \\max(Y(t) - D, 0)$", "body": "With $w := \\eta_d / (T_\\nu^2 B^2 + T_\\nu B \\eta_d / 3)$, since $|\\tilde{Y}(t+T_\\nu)-\\tilde{Y}(t)| \\le T_\\nu B$ and $w T_\\nu B < 3$, the Padé bound $e^y \\le 1 + y + \\frac{y^2}{2(1 - y/3)}$ yields $\\mathbb{E}[e^{w\\tilde{Y}(t+T_\\nu)} - e^{w\\tilde{Y}(t)}] \\le e^{2wT_\\nu B} - \\frac{w\\eta_d}{2}\\mathbb{E}[e^{w\\tilde{Y}(t)}]$.", "uses": ["⟨1⟩3.⟨2⟩1", "Routine.BackpressureDrift.exp_le_quad_div"], "lean": "Proofs.ExponentialAttraction.exp_lyapunov_drift"}, {"id": "⟨1⟩4.⟨2⟩2", "title": "Telescope & apply Markov's inequality (Q.E.D.)", "body": "Telescoping along residue classes $t_0 + j T_\\nu$ bounds $\\limsup \\frac{1}{t}\\sum_{\\tau<t}\\mathbb{E}[e^{w\\tilde{Y}(\\tau)}] \\le \\frac{2}{w\\eta_d} e^{2wT_\\nu B} =: c^*$. Setting $K := 1/w$, Markov's inequality yields $\\mathcal{P}^{(r)}(D, Km) \\le c^* e^{-wKm} = c^* e^{-m}$. $\\blacksquare$", "uses": ["⟨1⟩4.⟨2⟩1"], "lean": "Assembly.thm_prob_multi_con"}]}]}}, {"id": "thm:qlalifo_delay", "short_id": "Thm 4", "reference": "Theorem 4", "title": "LIFO-Backpressure Throughput Fraction & $O([\\log V]^2)$ Delay", "page": 5, "paper_loc": "Section VI-C (L593–666) — Headline Result", "proof_origin": "Main paper (Section VI-C) · Composed from Theorems 1, 2 & 3", "basis": "aligned", "basis_label": "Aligned + 5 mathematical repairs documented", "distilled": true, "loc": 3905, "defs": 121, "thms": 148, "witness": "LifoBackpressure.Examples.theorem4_witness", "witness_file": "lean/Examples/NetworkWitnesses.lean", "witness_note": "Full non-degenerate LIFO packet witness satisfying the guarded $0 < \\tilde{\\lambda}_j$ hypothesis.", "plain_english": "This is the paper's headline payoff: combine Backpressure's $O(1/V)$-optimal utility with a **LIFO** buffer discipline. Because Theorem 3 traps the queue inside a narrow $O([\\log V]^2)$ band $\\mathcal{B}_j$ around $\\gamma_{Vj}^*$ almost all the time, LIFO serves almost every newly arriving packet from the top of the stack before it ever sinks into the $\\Theta(V)$ base backlog. Consequently, all but a tiny $O(1/V^{\\log V})$ fraction of packets eventually depart with average delay just $O([\\log V]^2)$—an exponential delay improvement over FIFO's $O(V)$, with zero loss in utility!", "proof_sketch": "Theorem 4 directly composes Theorems 1, 2, and 3. First, finite average backlog from Theorem 2 plus Fatou's lemma ensures only finitely many packets ever get stranded forever, so the never-departing arrival rate is zero. Second, setting $m = (\\log V)^2$ in Theorem 3 and invoking Dominated Convergence (using a.s.-constant arrival rates) bounds the out-of-window arrival rate by $\\delta_{\\max} c^* / V^{\\log V}$, proving Part (a). Finally, when $\\tilde{\\lambda}_j > 0$, packets arriving inside $\\mathcal{B}_j$ occupy an enlarged integer buffer band $\\tilde{\\mathcal{B}}_j$ of width at most $2D + 2K(\\log V)^2 + 2\\delta_{\\max} + 1$ under Eq. (3); plugging this finite band into Theorem 1 immediately delivers the $O([\\log V]^2)$ delay bound in Part (b).", "paper_statement_html": "Under $V \\ge 1$, unique $\\boldsymbol{\\gamma}_V^*$, $\\eta$-slackness (2), and polyhedral growth (15), for any queue $j$ with arrival rate $\\lambda_j > 0$, under LIFO-Backpressure: **(a)** the rate $\\tilde{\\lambda}_j$ of packets arriving while $q_j(t) \\in \\mathcal{B}_j$ that eventually depart satisfies $\\lambda_j \\ge \\tilde{\\lambda}_j \\ge [\\lambda_j - \\delta_{\\max} c^* / V^{\\log V}]^+$; **(b)** their average delay is at most $W_{\\mathrm{bound}} \\triangleq [2D + 2K(\\log V)^2 + \\delta_{\\max}] / \\tilde{\\lambda}_j$ *(formalized with explicit $\\tilde{\\lambda}_j > 0$ guard and exact Eq. (3) numerator $+ 2\\delta_{\\max} + 1$)*.", "paper_tex": "Assume $V\\geq1$, and define $Q_{j, High}$ and $Q_{j, Low}$ as: \n\\begin{eqnarray*}\nQ_{j, High} &\\defequiv&  \\gamma_{V j}^* + D + K[\\log(V)]^2, \\\\\nQ_{j, Low} &\\defequiv& \\max[\\gamma_{V j}^* - D - K[\\log(V)]^2, 0]. \n\\end{eqnarray*}\nDefine the interval \n$\\script{B}_j \\defequiv [Q_{j, High}, Q_{j, Low}]$.  The following theorem considers\nthe rate and delay of packets that enter when $q_j(t) \\in \\script{B}_j$ and that eventually depart. \n\n%\\textcolor{red}{Note that here we need to make the interval a bit larger in order to use the theorem.}\n\n\\begin{thm} \\label{thm:qlalifo_delay}\nSuppose that $V\\geq1$, that \n$\\bv{\\gamma}_V^*$ is unique, that the slackness assumption \n(\\ref{eq:slackness}) holds, and that the dual function $g(\\bv{\\gamma})$ satisfies: \n\\begin{eqnarray}\ng(\\bv{\\gamma}^*_V)\\geq g(\\bv{\\gamma})+L||\\bv{\\gamma}^*_V-\\bv{\\gamma}||\\quad\\forall\\,\\,\\bv{\\gamma}\\succeq\\bv{0}\\label{eq:dualpolyhedralcond2},\n\\end{eqnarray}\nfor some constant $L>0$ independent of $V$.  Define $D, K, c^*$ as in Theorem  \\ref{thm:prob_multi_con}, and define $\\script{B}_j$ as above. \nThen for any queue $j$ with a time average input rate $\\lambda_j>0$, \nwe have under LIFO-Backpressure that: \n\n(a) The rate $\\tilde{\\lambda}_j$ of packets that both arrive to queue $j$ when $q_j(t) \\in\\script{B}_j$ and that eventually \ndepart the queue satisfies: \n\\begin{eqnarray}\n\\lambda_j \\geq \\tilde{\\lambda}_j \\geq \\left[\\lambda_j - \\frac{\\delta_{max}c^*}{V^{\\log(V)}}\\right]^+. \\label{eq:rate-major}\n\\end{eqnarray}\n\n(b) The average delay of these packets is at most $W_{bound}$, where: \n\\[ W_{bound} \\defequiv [2D + 2K[\\log(V)]^2+\\delta_{max}]/\\tilde{\\lambda}_j. \\]\n\\end{thm} \n\nThis theorem says that the delay of packets that enter when $q_j(t) \\in \\script{B}_j$ and that eventually \ndepart is at most $O([\\log(V)]^2)$.  Further, by (\\ref{eq:rate-major}), when $V$ is large, these packets represent the overwhelming majority,\n in that the rate of packets not in this set is at most $O(1/V^{\\log(V)})$. \n\n\\begin{proof} (Theorem \\ref{thm:qlalifo_delay})   Theorem \\ref{theorem:qla-markovian} shows that average queue backlog is finite.  Thus, there can be at most a finite\nnumber of packets that enter the queue and never depart, so the rate of packets arriving that never depart must be $0$.  \nIt follows that $\\tilde{\\lambda}_j$ is equal to the rate at \nwhich packets arrive when $q_j(t) \\in \\script{B}_j$. \nDefine the indicator function $1_j(t)$ to be $1$ if \n$q_j(t) \\notin \\script{B}_j$, and $0$ else.  Define $\\tilde{\\lambda}_j^c \\defequiv \\lambda_j - \\tilde{\\lambda}_j$. \nThen with probability 1 we get: \\footnote{The \ntime average expectation is the same as the pure time average by the Lebesgue Dominated Convergence\nTheorem, because we assume the pure time average exists with\nprobability 1, and that $0 \\leq A_j(t) \\leq \\delta_{max} \\: \\forall t$.} \n\\begin{eqnarray*}\n \\tilde{\\lambda}_j^c &=& \\lim_{t\\rightarrow\\infty} \\frac{1}{t}\\sum_{\\tau=0}^{t-1} A_j(\\tau)1_j(\\tau) \\\\\n &=& \\lim_{t\\rightarrow\\infty} \\frac{1}{t}\\sum_{\\tau=0}^{t-1}\\expect{A_j(\\tau)1_j(\\tau)}.  \n\\end{eqnarray*}\nThen using the fact that $A_j(t)\\leq\\delta_{max}$ for all $j, t$: \n\\begin{eqnarray*}\n \\expect{A_j(t)1_j(t)} &=& \\expect{A_j(t)|  q_j(t) \\notin \\script{B}_j}\\prob\\{q_j(t)\\notin\\script{B}_j) \\\\\n &\\leq& \\delta_{max} \\prob(q_j(t)\\notin[Q_{j,Low}, Q_{j,High}]). \n\\end{eqnarray*}\nTherefore: \n\\begin{eqnarray*}\n\\tilde{\\lambda}_j^c &\\leq& \\delta_{max}\\lim_{t\\rightarrow\\infty} \\frac{1}{t}\\sum_{\\tau=0}^{t-1}\\prob(q_j(\\tau) \\notin [Q_{j,Low}, Q_{j,High}]) \\\\\n&\\leq& \\delta_{max} \\lim_{t\\rightarrow\\infty} \\frac{1}{t}\\sum_{\\tau=0}^{t-1}\\prob(|q_j(\\tau) - \\gamma_{V, j}^*| > D + Km), \n\\end{eqnarray*}\nwhere we define $m \\defequiv [\\log(V)]^2$, and note that $m\\geq0$ because $V\\geq1$. From Theorem \\ref{thm:prob_multi_con} we thus have: \n\\begin{eqnarray}\n0 \\leq \\tilde{\\lambda}_j^c \\leq \\delta_{max} c^* e^{-m}  = \\frac{\\delta_{max}c^*}{V^{\\log(V)}}.\n\\end{eqnarray}\nThis completes the proof of part (a).  \nNow define $\\tilde{\\script{B}_j}= \\defequiv [Q_{j, High}+\\delta_{max}, Q_{j, Low}]$. Since $\\script{B}_j\\subset\\tilde{\\script{B}_j}$, we see that the rate of the packets that enter $\\tilde{\\script{B}_j}$ is at least $\\tilde{\\lambda}_j$. \nPart (b) then follows from Theorem \\ref{theorem:little1} and the facts that queue $j$ is stable and  that  $|\\tilde{\\script{B}_j}|\\leq2D + 2K[\\log(V)]^2+\\delta_{max}$. \n\\end{proof} ", "routine_deps": [], "setup_deps": ["S5"], "witness_node": "W2", "edits": ["thm4-reversed-interval", "thm4-partb-guard-and-width"], "declaration": "Assembly.thm_qlalifo_delay", "expected": "LifoBackpressure.Statements.Theorem4Statement", "axioms": ["propext", "Classical.choice", "Quot.sound"], "sha256": "47754462295bebbcd14e2f6e55aaf15c88a4c4e12c88c5c6dbd3472cd953f099", "lean_source": "import Statements.Little\nimport Statements.MarkovTradeoff\nimport Statements.ExponentialAttraction\n\n/-!\n# Statements for Theorem 4 (`thm:qlalifo_delay`): LIFO-Backpressure Throughput and `O([log V]^2)` Delay\n\nFormalizes the clean, mathematically sound version of Theorem 4 of `arXiv:1008.4895v2`\n(Section VI-C, lines 587-666). Differences against the manuscript prose (reversed `[Q_High, Q_Low]`\ntypo, missing `λ̃_j > 0` guard in Part (b), a.s.-constant time averages for Dominated Convergence,\ndiscrete unit-packet LIFO buffer coupling, and exact `+ 2 δ_max + 1` window width under Eq. (3))\nare explicitly recorded in `comparisons.json` and `manuscript-edits.json`.\n-/\n\nnamespace LifoBackpressure.Statements\n\nopen Filter MeasureTheory Classical\n\n/-- Upper window endpoint `Q_{j,High} = γ*_{Vj} + D + K [log(V)]^2` (Section VI-C, L601). -/\nnoncomputable def qHigh (γstar_j D K V : ℝ) : ℝ :=\n  γstar_j + D + K * (Real.log V) ^ 2\n\n/-- Lower window endpoint `Q_{j,Low} = max(γ*_{Vj} - D - K [log(V)]^2, 0)` (Section VI-C, L602). -/\nnoncomputable def qLow (γstar_j D K V : ℝ) : ℝ :=\n  max (γstar_j - D - K * (Real.log V) ^ 2) 0\n\n/-- Corrected backlog window `B_j = [Q_{j,Low}, Q_{j,High}]` (manuscript L605 writes endpoints reversed). -/\ndef backlogWindow (γstar_j D K V : ℝ) : Set ℝ :=\n  Set.Icc (qLow γstar_j D K V) (qHigh γstar_j D K V)\n\n/-- A discrete unit-packet LIFO buffer realization for queue `j` of a Backpressure policy `Π`,\ncoupling individual packet arrival/departure/buffer-slot trajectories to `Π.queue τ ω j` and\n`M.arrival (proc.S τ ω) (Π.act τ ω) j` under the queueing dynamics Eq. (3). -/\nstructure LifoQueueRealization {M : NetworkModel} {Ω : Type} [MeasurableSpace Ω]\n    {μ : Measure Ω} [IsProbabilityMeasure μ] {proc : M.MarkovProcess Ω μ}\n    (pol : M.Policy proc) (j : Fin M.r) (ι : Type) where\n  /-- Discrete arrival slot of packet `k` on sample path `ω`. -/\n  arrival : Ω → ι → ℕ\n  /-- Departure slot of packet `k` on sample path `ω`, or `⊤` if it never departs. -/\n  depart : Ω → ι → WithTop ℕ\n  /-- Fixed nonnegative integer LIFO buffer slot occupied by packet `k` on sample path `ω`. -/\n  slot : Ω → ι → ℕ\n  /-- No packet departs before it arrives. -/\n  arrival_le_depart : ∀ ω k, (arrival ω k : WithTop ℕ) ≤ depart ω k\n  /-- Only finitely many packets arrive before any finite horizon `t`. -/\n  finite_arrivals : ∀ ω (t : ℕ), Set.Finite {k : ι | arrival ω k < t}\n  /-- Each LIFO buffer slot holds at most one packet at any time slot `τ`. -/\n  disjoint_slots :\n    ∀ ω k₁ k₂, k₁ ≠ k₂ → slot ω k₁ = slot ω k₂ →\n      ∀ τ : ℕ, ¬ ((arrival ω k₁ ≤ τ ∧ (τ : WithTop ℕ) < depart ω k₁) ∧\n                   (arrival ω k₂ ≤ τ ∧ (τ : WithTop ℕ) < depart ω k₂))\n  /-- Packet arrivals in slot `τ` match `A_j(τ, ω)`. -/\n  arrivals_at_eq :\n    ∀ ω (τ : ℕ),\n      (((finite_arrivals ω (τ + 1)).subset (fun k (hk : arrival ω k = τ) => hk ▸ Nat.lt_succ_self τ)).toFinset.card : ℝ) =\n        M.arrival (proc.S τ ω) (pol.act τ ω) j\n  /-- Under Eq. (3), packets arriving at slot `τ` are placed on top of the post-service queue\n  `max(q_j(τ) - μ_j(τ), 0)` and strictly below `q_j(τ) + δ_max`. -/\n  slot_bounds :\n    ∀ ω k,\n      let τ := arrival ω k\n      max (pol.queue τ ω j - M.δmax) 0 ≤ (slot ω k : ℝ) ∧\n      (slot ω k : ℝ) < pol.queue τ ω j + M.δmax\n  /-- Packets that arrived before time `τ` and never depart remain counted in the backlog `q_j(τ)`. -/\n  never_depart_le_queue :\n    ∀ ω (τ : ℕ),\n      (((finite_arrivals ω τ).subset (fun k (hk : arrival ω k < τ ∧ depart ω k = ⊤) => hk.1)).toFinset.card : ℝ) ≤\n        pol.queue τ ω j\n  /-- Measurability of the count of never-departing packets arriving before time `τ`. -/\n  measurable_never_depart :\n    ∀ (τ : ℕ),\n      Measurable (fun ω =>\n        (((finite_arrivals ω τ).subset (fun k (hk : arrival ω k < τ ∧ depart ω k = ⊤) => hk.1)).toFinset.card : ℝ))\n\nnamespace LifoQueueRealization\n\nvariable {M : NetworkModel} {Ω : Type} [MeasurableSpace Ω]\n    {μ : Measure Ω} [IsProbabilityMeasure μ] {proc : M.MarkovProcess Ω μ}\n    {pol : M.Policy proc} {j : Fin M.r} {ι : Type}\n\n/-- Set of packets on sample path `ω` that arrive while `q_j(t) ∈ B_j` and eventually depart. -/\ndef windowDepartingSet (L : LifoQueueRealization pol j ι) (γstar_j D K V : ℝ) (ω : Ω) : Set ι :=\n  {k | pol.queue (L.arrival ω k) ω j ∈ backlogWindow γstar_j D K V ∧ L.depart ω k ≠ ⊤}\n\n/-- Number of packets in `windowDepartingSet` that arrive before time `t`. -/\nnoncomputable def windowDepartingArrivals (L : LifoQueueRealization pol j ι)\n    (γstar_j D K V : ℝ) (ω : Ω) (t : ℕ) : ℕ :=\n  ((L.finite_arrivals ω t).subset\n    (fun k (hk : L.arrival ω k < t ∧ k ∈ L.windowDepartingSet γstar_j D K V ω) => hk.1)).toFinset.card\n\n/-- Set of integer buffer slots reachable by packets arriving while `q_j(t) ∈ B_j` under Eq. (3). -/\nnoncomputable def enlargedBufferSlots (γstar_j D K V δmax : ℝ) : Finset ℕ :=\n  Finset.Ico (Nat.floor (max (qLow γstar_j D K V - δmax) 0))\n    (Nat.ceil (qHigh γstar_j D K V + δmax))\n\n/-- The `BufferSystem` obtained by restricting `L` to `windowDepartingSet`, whose slots all lie in\n`enlargedBufferSlots`. -/\nnoncomputable def windowBufferSystem (L : LifoQueueRealization pol j ι)\n    (γstar_j D K V : ℝ) (ω : Ω) :\n    BufferSystem {b : ℕ // b ∈ enlargedBufferSlots γstar_j D K V M.δmax}\n      {k : ι // k ∈ L.windowDepartingSet γstar_j D K V ω} where\n  arrival k := L.arrival ω k.1\n  depart k := L.depart ω k.1\n  slot k := ⟨L.slot ω k.1, by\n    rcases k.2 with ⟨hwin, _⟩\n    have hsb := L.slot_bounds ω k.1\n    rw [enlargedBufferSlots, Finset.mem_Ico]\n    constructor\n    · apply Nat.floor_le_of_le\n      calc max (qLow γstar_j D K V - M.δmax) 0\n          ≤ max (pol.queue (L.arrival ω k.1) ω j - M.δmax) 0 :=\n            max_le_max_right 0 (sub_le_sub_right hwin.1 M.δmax)\n        _ ≤ (L.slot ω k.1 : ℝ) := hsb.1\n    · rw [Nat.lt_ceil]\n      linarith [hsb.2, hwin.2]⟩\n  arrival_le_depart k := L.arrival_le_depart ω k.1\n  finite_arrivals t :=\n    (L.finite_arrivals ω t).preimage (fun _ _ _ _ h => Subtype.ext h)\n  disjoint_slots k₁ k₂ hne hsl τ :=\n    L.disjoint_slots ω k₁.1 k₂.1 (fun h => hne (Subtype.ext h)) (congrArg Subtype.val hsl) τ\n\nend LifoQueueRealization\n\n/-- Paper Theorem 4 (`thm:qlalifo_delay`, clean mathematically sound formulation):\nUnder `V ≥ 1`, unique dual optimum `γ*_V`, `η`-slackness, and `V`-independent polyhedral dual\ngrowth with constant `L > 0`, there exist `V`-independent constants `D, K, c* > 0` (from Theorem 3)\nsuch that for any queue `j` with a.s.-constant time-average arrival rate `λ_j > 0` and\na.s.-constant in-window arrival rate `λ̃_j`:\n  (a) `λ̃_j` equals the a.s. arrival rate of packets arriving when `q_j(t) ∈ B_j` that eventually\n      depart, and satisfies `λ_j ≥ λ̃_j ≥ max(λ_j - δ_max c* / V^{log V}, 0)`.\n  (b) Whenever `λ̃_j > 0`, with probability 1 the `limsup` average delay of these packets is at\n      most `(2D + 2K [log V]^2 + 2 δ_max + 1) / λ̃_j`. -/\ndef Theorem4Statement : Prop :=\n  ∀ (M : NetworkModel) (η L : ℝ),\n    M.HasSlackness η →\n    0 < L →\n    ∃ (D K cstar : ℝ), 0 < D ∧ 0 < K ∧ 0 < cstar ∧\n      ∀ (V : ℝ), 1 ≤ V →\n        ∀ (γstar : Fin M.r → ℝ),\n          M.IsUniqueDualOpt V γstar →\n          M.DualPolyhedral V γstar L →\n          ∀ (Ω : Type) [MeasurableSpace Ω] (μ : Measure Ω) [IsProbabilityMeasure μ]\n            (proc : M.MarkovProcess Ω μ) (pol : M.Policy proc),\n            pol.FollowsBackpressure V →\n            ∀ (j : Fin M.r) (ι : Type) (Q : LifoQueueRealization pol j ι)\n              (lamJ lamTilde : ℝ),\n              0 < lamJ →\n              (∀ᵐ ω ∂μ, Filter.Tendsto\n                (fun t : ℕ => ((1 : ℝ) / (t : ℝ)) *\n                  ∑ τ ∈ Finset.range t, M.arrival (proc.S τ ω) (pol.act τ ω) j)\n                Filter.atTop (nhds lamJ)) →\n              (∀ᵐ ω ∂μ, Filter.Tendsto\n                (fun t : ℕ => ((1 : ℝ) / (t : ℝ)) *\n                  ∑ τ ∈ Finset.range t,\n                    if pol.queue τ ω j ∈ backlogWindow (γstar j) D K V\n                    then M.arrival (proc.S τ ω) (pol.act τ ω) j else 0)\n                Filter.atTop (nhds lamTilde)) →\n              -- Part (a): rate of in-window eventually-departing packets\n              (∀ᵐ ω ∂μ, Filter.Tendsto\n                (fun t : ℕ =>\n                  ((Q.windowDepartingArrivals (γstar j) D K V ω t : ℝ) / (t : ℝ)))\n                Filter.atTop (nhds lamTilde)) ∧\n              max (lamJ - M.δmax * cstar / (V ^ Real.log V)) 0 ≤ lamTilde ∧\n              lamTilde ≤ lamJ ∧\n              -- Part (b): O([log V]^2) average delay bound whenever lamTilde > 0\n              (0 < lamTilde →\n                ∀ᵐ ω ∂μ,\n                  Filter.limsup\n                    (fun t : ℕ =>\n                      ((Q.windowBufferSystem (γstar j) D K V ω).avgDelay t : EReal))\n                    Filter.atTop ≤\n                    (((2 * D + 2 * K * (Real.log V) ^ 2 + 2 * M.δmax + 1) / lamTilde : ℝ) : EReal))\n\nend LifoBackpressure.Statements\n", "comparison": {"result": "difference", "summary": "LifoBackpressure.Statements.Theorem4Statement intentionally formalizes the mathematically sound version of Paper Theorem 4 (thm:qlalifo_delay) across all 11 numbered obligations (C1-C11), exposing genuine gaps and a constant error in the printed manuscript. Part (a) matches the paper's rate bounds verbatim once a.s.-constant time averages (C5) and a discrete unit-packet LIFO realization (C7) are added and the reversed-endpoint typo at L605 is corrected (C4). Part (b) adds the missing guard 0 < lamTilde (C8) to avoid division by zero when V >= 1 is small, and proves the coarser bound (2D + 2K[log V]^2 + 2*delta_max + 1) / lamTilde instead of the paper's (2D + 2K[log V]^2 + delta_max) / lamTilde (C11, weaker conclusion) because Eq. (3) serves up to delta_max packets before arrivals—shifting the bottom reachable buffer slot down by delta_max—and discrete integer slot counting adds up to +1. Both bounds have the same O([log V]^2 / lamTilde) asymptotic order, but because C11 has a strictly larger numerator, the comparison result is recorded as difference for author review and manuscript revision tracking.", "scope": "Theorem4Statement captures the complete mathematically sound O([log V]^2) LIFO-Backpressure delay guarantee (Part (a) exact, Part (b) with the sound numerator 2D + 2K[log V]^2 + 2*delta_max + 1 under Eq. (3) and explicit 0 < lamTilde guard). It does not prove the printed manuscript's tighter numerator 2D + 2K[log V]^2 + delta_max under Eq. (3), nor does it hold without a.s.-constant time averages, 0 < lamTilde, and a discrete packet realization. All noncomputable definitions are classical analysis/cardinality/measure-theory operations without any algorithmic conflict; all external dependencies are standard Mathlib/Lean packages.", "advice": "Do not approve as an exact match to the unedited manuscript; instead review the five identified manuscript discrepancies (especially the +2*delta_max + 1 buffer width under Eq. (3) and the missing lambda_tilde_j > 0 guard in Part (b)), track them as proposed manuscript revisions in manuscript-edits.json, and confirm whether Theorem4Statement should be accepted as the clean target formal statement.", "stronger_result": null, "issue": "Theorem4Statement formalizes the clean, mathematically sound version of Theorem 4 and therefore differs from the printed manuscript in five concrete ways (one coarser constant in Part (b) plus four missing hypotheses/corrections): (1) Part (b)'s numerator is 2D + 2K[log V]^2 + 2*delta_max + 1 rather than the paper's 2D + 2K[log V]^2 + delta_max, because under Eq. (3) service up to delta_max occurs before arrivals so arriving packets can enter slots as low as max(Q_{j,Low} - delta_max, 0) (adding +delta_max to the buffer window width) and discrete integer slot counting adds at most +1; (2) Part (b) adds the explicit guard 0 < lamTilde (omitted in the paper, where V >= 1 alone allows lamTilde = 0 and division by zero in W_bound); (3) Lean assumes a.s.-constant deterministic time-average arrival rates lamJ and lamTilde (whereas L593 only states that time averages exist a.s., which is insufficient for the DCT step equating sample-path averages to expectations at L641-L648); (4) Lean adds an explicit discrete unit-packet LifoQueueRealization coupling packets and integer slots to real-valued Eq. (3) dynamics; and (5) Lean corrects the reversed-endpoint typo B_j = [Q_{j,High}, Q_{j,Low}] at L605/L664 to [Q_{j,Low}, Q_{j,High}].", "cases": [{"code": "C1", "case": "C1: Section III-V system model under LIFO-Backpressure", "kind": "restriction", "polarity": "gap", "paper": "Section III-V stochastic network model running LIFO-Backpressure (L280-L319, L430-L435, L619).", "lean": "NetworkModel M (f in [0, δmax], explicit Nonempty (Action s)), MarkovProcess proc, Policy pol with pol.FollowsBackpressure V (deterministic choice(s, q)).", "why": "Matches the Section III-V model under the same nonnegative-cost normalization and deterministic Backpressure selector used in Theorems 2 and 3."}, {"code": "C2", "case": "C2: Control parameter V >= 1", "kind": "agrees", "polarity": "agrees", "paper": "V >= 1 (L599, L611).", "lean": "1 <= V.", "why": "Exact match."}, {"code": "C3", "case": "C3: Unique dual optimum, Slater eta-slackness, and V-independent polyhedral dual growth", "kind": "other form", "polarity": "nuance", "paper": "Unique gamma_V^*, eta-slackness (Eq. 2), and g(gamma_V^*) >= g(gamma) + L ||gamma_V^* - gamma|| for all gamma >= 0 with L > 0 independent of V (L611-L617).", "lean": "M.HasSlackness η (finite Fin m convex combination), 0 < L outside ∀ V, M.IsUniqueDualOpt V γstar, and M.DualPolyhedral V γstar L.", "why": "Exact match up to the equivalent finite convex combination form of HasSlackness (by compactness and Caratheodory's theorem)."}, {"code": "C4", "case": "C4: Constants D, K, c^* and backlog window B_j", "kind": "chosen reading", "polarity": "nuance", "paper": "D, K, c^* = Theta(1) from Theorem 3; Q_{j,High} = gamma_{Vj}^* + D + K[log V]^2, Q_{j,Low} = max[gamma_{Vj}^* - D - K[log V]^2, 0], and B_j := [Q_{j,High}, Q_{j,Low}] (reversed endpoints at L605/L664; corrected to [Q_{j,Low}, Q_{j,High}] at L652).", "lean": "Existential D, K, cstar > 0 independent of V (instantiated by Theorem 3 in the proof); qHigh, qLow, and backlogWindow := Set.Icc (qLow ...) (qHigh ...).", "why": "Corrects the typographical reversal [Q_{j,High}, Q_{j,Low}] at L605/L664 to the non-empty interval [Q_{j,Low}, Q_{j,High}] actually used in the proof at L652."}, {"code": "C5", "case": "C5: Almost-sure constancy (ergodicity) of time-average arrival rates", "kind": "added hypothesis", "polarity": "gap", "paper": "L593 assumes only that time averages under Backpressure exist with probability 1, yet L641-L648 invokes DCT to equate the a.s. sample-path average to the limiting expectation.", "lean": "Explicitly takes deterministic constants lamJ, lamTilde : ℝ and assumes the full arrival rate converges a.s. to lamJ and the in-window arrival rate converges a.s. to lamTilde.", "why": "Without a.s. constancy (ergodicity), a random a.s. limit X(ω) only satisfies E[X] = lim (1/t) sum E[...], not X(ω) = lim (1/t) sum E[...] a.s. Lean adds the exact deterministic-limit hypothesis needed to make the proof valid."}, {"code": "C6", "case": "C6: Positive time-average input rate lambda_j > 0 for queue j", "ki ets arriving before $\\tau$ that never depart is monotone nondecreasing and bounded by $q_j(\\tau, \\omega)$. Fatou's lemma yields $\\mathbb{E}[\\sup_\\tau N_\\infty(\\tau)] < \\infty$, hence $\\sup_\\tau N_\\infty(\\tau) < \\infty$ a.s.", "uses": ["⟨1⟩1.⟨2⟩1", "LifoQueueRealization.never_depart_le_queue"], "lean": "Proofs.LifoDelay.ae_eventually_bounded_never_depart"}, {"id": "⟨1⟩1.⟨2⟩3", "title": "In-window eventually-departing rate equals $\\tilde{\\lambda}_j$ a.s.", "body": "Subtracting a bounded count divided by $t$ vanishes as $t \\to \\infty$, so the a.s. arrival rate of in-window *eventually-departing* packets equals $\\tilde{\\lambda}_j$.", "uses": ["⟨1⟩1.⟨2⟩2"], "lean": "Proofs.LifoDelay.window_departing_rate_eq"}]}, {"id": "⟨1⟩2", "title": "Throughput-fraction bound — Part (a) (Theorem 3 + DCT)", "steps": [{"id": "⟨1⟩2.⟨2⟩1", "title": "Dominated Convergence on out-of-window arrivals", "body": "Set $\\tilde{\\lambda}_j^c := \\lambda_j - \\tilde{\\lambda}_j$ and $1_j(\\tau) := \\mathbf{1}_{q_j(\\tau) \\notin \\mathcal{B}_j}$. Because $\\frac{1}{t}\\sum_{\\tau<t} A_j(\\tau)1_j(\\tau) \\to \\tilde{\\lambda}_j^c$ a.s. (deterministic limit!) and is bounded by $\\delta_{\\max}$, Dominated Convergence gives $\\tilde{\\lambda}_j^c = \\lim_{t\\to\\infty} \\frac{1}{t}\\sum_{\\tau<t} \\mathbb{E}[A_j(\\tau)1_j(\\tau)]$.", "uses": ["a.s.-constant ergodicity hypothesis"], "lean": "Proofs.LifoDelay.out_of_window_rate_le"}, {"id": "⟨1⟩2.⟨2⟩2", "title": "Apply Theorem 3 at $m := (\\log V)^2$", "body": "Since $q_j(\\tau) \\notin [Q_{j,\\mathrm{Low}}, Q_{j,\\mathrm{High}}]$ implies $|q_j(\\tau) - \\gamma_{Vj}^*| > D + K(\\log V)^2$, Theorem 3 at $m = (\\log V)^2 \\ge 0$ yields $\\tilde{\\lambda}_j^c \\le \\delta_{\\max}\\,\\mathcal{P}^{(r)}(D, K(\\log V)^2) \\le \\delta_{\\max} c^* e^{-(\\log V)^2} = \\delta_{\\max} c^* / V^{\\log V}$.", "uses": ["⟨1⟩2.⟨2⟩1", "Theorem 3 (Assembly.thm_prob_multi_con)"], "lean": "Proofs.LifoDelay.theorem4_part_a"}]}, {"id": "⟨1⟩3", "title": "$O([\\log V]^2)$ delay bound — Part (b) (Theorem 1)", "steps": [{"id": "⟨1⟩3.⟨2⟩1", "title": "Exact enlarged buffer slot set $\\tilde{\\mathcal{B}}_j$ under Eq. (3)", "body": "Assume $\\tilde{\\lambda}_j > 0$. Because Eq. (3) applies service $\\mu_j \\le \\delta_{\\max}$ *before* arrivals $A_j \\le \\delta_{\\max}$, packets arriving while $q_j(t) \\in [Q_{j,\\mathrm{Low}}, Q_{j,\\mathrm{High}}]$ land in integer slots inside $\\tilde{\\mathcal{B}}_j = [\\max(Q_{j,\\mathrm{Low}}-\\delta_{\\max},0), Q_{j,\\mathrm{High}}+\\delta_{\\max})$, whose cardinality is at most $2D + 2K(\\log V)^2 + 2\\delta_{\\max} + 1$.", "uses": ["LifoQueueRealization.slot_bounds", "0 < lamTilde guard"], "lean": "Proofs.LifoDelay.tight_slot_card_le"}, {"id": "⟨1⟩3.⟨2⟩2", "title": "Invoke Modified Little's Theorem (Q.E.D.)", "body": "Restricting to in-window eventually-departing packets gives a `BufferSystem` over $\\tilde{\\mathcal{B}}_j$ with a.s. arrival rate $\\tilde{\\lambda}_j > 0$ (hence $D(t) \\ge N(t) - |\\tilde{\\mathcal{B}}_j| \\to \\infty$). Theorem 1 directly yields $\\limsup_{t\\to\\infty} \\mathrm{avgDelay}(t) \\le (2D + 2K(\\log V)^2 + 2\\delta_{\\max} + 1) / \\tilde{\\lambda}_j$ a.s. $\\blacksquare$", "uses": ["⟨1⟩1.⟨2⟩3", "⟨1⟩3.⟨2⟩1", "Theorem 1 (Assembly.theorem_little1)"], "lean": "Assembly.thm_qlalifo_delay"}]}]}}], "edits": [{"id": "thm4-reversed-interval", "claim": "thm:qlalifo_delay", "edition": "arXiv:1008.4895v2", "location": "Section VI-C, L604-L605 and L664", "original": "Define the interval $\\script{B}_j \\defequiv [Q_{j, High}, Q_{j, Low}]$. ... Now define $\\tilde{\\script{B}_j}= \\defequiv [Q_{j, High}+\\delta_{max}, Q_{j, Low}]$.", "replacement": "Define the interval $\\script{B}_j \\defequiv [Q_{j, Low}, Q_{j, High}]$. ... Now define $\\tilde{\\script{B}}_j \\defequiv [\\max[Q_{j, Low}-\\delta_{max}, 0], Q_{j, High}+\\delta_{max}]$.", "reason": "Endpoints of B_j and B_tilde_j are written in reverse order (Q_{j,High} >= Q_{j,Low}), and L664 also has a duplicate }
function katexHtml(tex, display) {

  }
  return display ? `<div><code>${esc(tex)}</code></div>` : `<code>${esc(tex)}</code>`;
}
function rich(src) {
  if (!src) return "";
  const re = /(\$\$[\s\S]+?\$\$|\$[^$\n]+?\$|`[^`\n]+?`|\*\*[^*\n]+?\*\*|\*[^*\n]+?\*)/g;
  let out = "", last = 0, m;
  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    const t = m[0];
    if (t.startsWith("$$")) out += katexHtml(t.slice(2, -2), true);
    else if (t.startsWith("$")) out += katexHtml(t.slice(1, -1), false);
    else if (t.startsWith("`")) out += `<code>${esc(t.slice(1, -1))}</code>`;
    else if (t.startsWith("**")) out += `<strong>${rich(t.slice(2, -2))}</strong>`;
    else out += `<em>${rich(t.slice(1, -1))}</em>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}
function hlLean(src) {

  while ((m = re.exec(src))) {
    out += esc(src.slice(last, m.index));
    out += `<span class="${m[1]||m[2]?"cc":"ck"}">${esc(m[0])}</span>`;
    last = re.lastIndex;
  }
  return out + esc(src.slice(last));
}

function renderGraphView() {
  const showSetup = state.graphEdges.setup;
  const showRoutine = state.graphEdges.routine;
  const showWitness = state.graphEdges.witness;
  const nodes = DATA.graph.nodes.filter(n => n.layer === "theorem" || (n.layer === "setup" && showSetup) || (n.layer === "routine" && showRoutine) || (n.layer === "witness" && showWitness));
  const ids = new Set(nodes.map(n => n.id));
  const edges = DATA.graph.edges.filter(e => ids.has(e.from) && ids.has(e.to) && state.graphEdges[e.kind]);
  if (!ids.has(state.graphSel)) state.graphSel = "T4";

  const W = 940, NW = 166, NH = 72;
  const pos = {};
  let curY = 26;
  const putRow = (list, y) => {
    const gap = 16, rw = list.length * NW + (list.length - 1) * gap, sx = (W - rw) / 2;
    list.forEach((n, i) => pos[n.id] = { x: sx + i * (NW + gap), y });
  };
  const setups = nodes.filter(n => n.layer === "setup");
  const routines = nodes.filter(n => n.layer === "routine");
  const thms = nodes.filter(n => n.layer === "theorem");
  const wits = nodes.filter(n => n.layer === "witness");
  if (setups.length) { putRow(setups, curY); curY += 116; }
  if (routines.length) { putRow(routines, curY); curY += 110; }
  putRow(thms.filter(n => n.id !== "T4"), curY); curY += 116;
  putRow(thms.filter(n => n.id === "T4"), curY); curY += 110;
  if (wits.length) { putRow(wits, curY); curY += 96; }
  const H = Math.max(460, curY + 20);

  const sel = state.graphSel;
  const up = new Set(), down = new Set();
  const walk = (dir, out) => {
    const q = [sel];
    while (q.length) {
      const u = q.pop();
      for (const e of edges) {
        const nxt = dir === "up" ? (e.to === u ? e.from : null) : (e.from === u ? e.to : null);
        if (nxt && !out.has(nxt)) { out.add(nxt); q.push(nxt); }
      }
    }
  };
  walk("up", up); walk("down", down);
  const inTr = id => id === sel || up.has(id) || down.has(id);

  const edgeSvg = edges.map(e => {
    const a = pos[e.from], b = pos[e.to], rev = a.y > b.y;
    const x1 = a.x + NW/2, y1 = rev ? a.y : a.y + NH;
    const x2 = b.x + NW/2, y2 = rev ? b.y + NH + 4 : b.y - 4;
    const my = (y1 + y2) / 2;
    const hot = ((up.has(e.from)||e.from===sel)&&(up.has(e.to)||e.to===sel)) || ((down.has(e.from)||e.from===sel)&&(down.has(e.to)||e.to===sel));
    return `<path class="ge ${e.kind} ${hot?"hot":"dim"}" marker-end="url(#a-${e.kind})" d="M${x1},${y1} C${x1},${my} ${x2},${my} ${x2},${y2}"><title>${esc(e.from)} → ${esc(e.to)} (${e.kind}): ${esc(e.reason)}</title></path>`;
  }).join("");

  const nodeSvg = nodes.map(n => {
    const p = pos[n.id];
    const glyph = n.layer === "setup" ? "🔒" : n.layer === "witness" ? "★" : n.status === "verified_lean" ? "⑂" : "✓";
    const col = n.status === "verified_diff" || n.status === "frozen_repair" ? "#b42318" : n.status === "verified_lean" ? "#4338ca" : n.layer === "setup" ? "#475569" : "#146c43";
    const revIcon = n.layer === "theorem" ? (state.goldPreview ? "✓" : "👁") : "";
    return `
      <g class="gn layer-${n.layer} status-${n.status} ${n.id===sel?"sel":""} ${inTr(n.id)?"":"dim"}" data-node="${n.id}" transform="translate(${p.x},${p.y})">
        <rect class="box" width="${NW}" height="${NH}" rx="8"/>
        <circle cx="15" cy="17" r="8" fill="${col}" opacity=".14"/>
        <text x="15" y="21" text-anchor="middle" font-size="10.5" fill="${col}" font-weight="700">${glyph}</text>
        <text x="28" y="20" font-size="10" font-weight="700" font-family="ui-monospace,monospace" fill="#0f62fe">${esc(n.ref)}</text>
        ${revIcon ? `<text x="${NW-10}" y="20" text-anchor="end" font-size="10.5" fill="${state.goldPreview?"#146c43":"#b42318"}">${revIcon}</text>` : ""}
        <text x="10" y="40" font-size="11.5" font-weight="600" fill="#0f172a">${esc(n.title.slice(0,23))}</text>
        <text x="10" y="57" font-size="9.5" font-family="ui-monospace,monospace" fill="#475569">${esc(n.loc ? n.loc.toLocaleString()+" LoC · " : "")}SHA ${esc(n.sha)}</text>
        ${n.diff_count ? `<g transform="translate(${NW-16},${NH-14})"><rect x="-10" y="-8" width="24" height="16" rx="8" fill="#b42318"/><text x="2" y="3.5" text-anchor="middle" font-size="9.5" fill="#fff" font-weight="700">${n.diff_count}Δ</text></g>` : ""}
      </g>`;
  }).join("");

  const cur = DATA.graph.nodes.find(n => n.id === sel);
  const inc = edges.filter(e => e.to === sel);
  const out = edges.filter(e => e.from === sel);

  return `
    <div class="sh" style="margin-top:0">
      <h2>Layered Dependency DAG (Frozen Inputs, Shared Theory, Theorems &amp; Witnesses)</h2>
      <span>${nodes.length} of ${DATA.graph.nodes.length} nodes · ${edges.length} edges · Click node to trace closure; double-click to inspect</span>
    </div>
    <div class="filter-bar">
      <span style="font-size:.76rem;font-weight:700;color:var(--muted)">Toggle Layers:</span>
      ${[
        ["uses", "— uses (4 Theorems)"],
        ["setup", "- - setup (5 Frozen Assumptions)"],
        ["routine", "··· routine (2 Shared Lean Theory)"],
        ["witness", "-·- witness (2 Non-Vacuity)"],
      ].map(([k, lbl]) => `<button class="f-btn" data-edge-kind="${k}" aria-pressed="${state.graphEdges[k]}">${lbl}</button>`).join("")}
    </div>
    <div class="graph-layout">
      <div class="graph-box">
        <svg class="graph-svg" viewBox="0 0 ${W} ${H}">
          <defs>
            <marker id="a-uses" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#0f172a"/></marker>
            <marker id="a-setup" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#64748b"/></marker>
            <marker id="a-routine" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#0b6374"/></marker>
            <marker id="a-witness" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,1 L9,5 L0,9 z" fill="#146c43"/></marker>
          </defs>
          ${edgeSvg}${nodeSvg}
        </svg>
      </div>
      <aside class="card">
        <div style="font:700 .74rem/1 var(--mono);color:var(--accent);text-transform:uppercase">${esc(cur.ref)} · ${esc(cur.layer)}</div>
        <h3 style="margin:.25rem 0 .45rem">${esc(cur.title)}</h3>
        <div style="display:flex;gap:.35rem;flex-wrap:wrap;margin-bottom:.6rem">
          ${chip("🔒 SHA " + cur.sha, "slate")}
          ${cur.loc ? chip(cur.loc.toLocaleString() + " LoC", "teal") : ""}
          ${cur.basis === "lean" ? chip("⑂ Lean-Only Route", "indigo") : ""}
          ${cur.diff_count ? chip(cur.diff_count + "Δ Diffs", "coral") : ""}
        </div>
        <p style="font-size:.84rem;margin:0 0 .65rem">${rich(cur.summary)}</p>
        <p style="font-size:.75rem;color:var(--muted);margin:0 0 .7rem"><code>${esc(cur.file)}</code></p>
        <strong style="font-size:.78rem">Upstream (${inc.length})</strong>
        <ul style="padding-left:1.1rem;margin:.3rem 0 .65rem;font-size:.78rem;color:var(--muted)">
          ${inc.length ? inc.map(e => `<li><strong>${esc(e.from)}</strong> (${esc(e.kind)}): ${esc(e.reason)}</li>`).join("") : "<li>Foundational layer</li>"}
        </ul>
        <strong style="font-size:.78rem">Downstream (${out.length})</strong>
        <ul style="padding-left:1.1rem;margin:.3rem 0 .8rem;font-size:.78rem;color:var(--muted)">
          ${out.length ? out.map(e => `<li><strong>${esc(e.to)}</strong> (${esc(e.kind)}): ${esc(e.reason)}</li>`).join("") : "<li>Headline endpoint</li>"}
        </ul>
        <button class="btn primary" style="width:100%;justify-content:center" data-open-claim="${cur.claim_id}" data-open-tab="english">Inspect Theorem Details →</button>
      </aside>
    </div>`;
}

function renderClaimInspector() {
  const c = claimById(state.claimId);
  let pane = "";
  if (state.claimTab === "english") {
    pane = `
      <div class="card">
        <h3 style="margin-top:0">Plain English</h3>
        <p style="max-width:72ch">${rich(c.plain_english)}</p>
        <h3>High-Level Proof Sketch</h3>
        <p style="max-width:72ch">${rich(c.proof_sketch)}</p>
        ${c.basis === "lean" ? `
          <div class="route-callout" style="margin-bottom:.75rem">
            <strong>⑂ Why Lean uses a different proof route for Theorem 2:</strong>
            ${rich("The companion paper [17] proves Theorem 2 via variable renewal return times and Carathéodory strong duality. Lean instead proves the exact same Theorem 2 statement directly via **Doeblin $L^1$ geometric mixing + Poisson's equation + elementary weak duality**. This means the companion paper's renewal-time derivation itself was not step-verified—while giving co-authors a cleaner, self-contained alternative proof.")}
          </div>` : ""}
        <p style="font-size:.82rem;color:var(--muted);margin-bottom:0"><strong>Origin:</strong> ${esc(c.proof_origin)} · <strong>Witness:</strong> <code>${esc(c.witness)}</code></p>
      </div>`;
  } else if (state.claimTab === "paper") {
    pane = `
      <div class="card">
        <p style="margin-top:0;font-size:.82rem;color:var(--muted)">${esc(c.paper_loc)} · <a href="${DATA.paper.arxiv_url}" target="_blank" rel="noopener">arXiv PDF ↗</a></p>
        <div style="padding:.85rem 1rem;background:var(--bg);border:1px solid var(--line);border-radius:8px;margin-bottom:.9rem">${rich(c.paper_statement_html)}</div>
        <details open><summary style="font-weight:700;font-size:.82rem;color:var(--accent);cursor:pointer">Verbatim TeX</summary><pre class="code">${esc(c.paper_tex)}</pre></details>
      </div>`;
  } else if (state.claimTab === "lamport") {
    const lp = c.lamport;
    pane = `
      <div class="card" style="margin-bottom:.8rem;background:${c.basis==="lean" ? "var(--indigo-bg)" : "var(--subtle)"};border-color:${c.basis==="lean" ? "var(--indigo-bd)" : "var(--line)"}">
        <strong>Provenance:</strong> ${rich(lp.provenance)}
      </div>
      ${lp.groups.map(g => `
        <details class="lp-card" open>
          <summary><span class="lp-tag">${esc(g.id)}</span> <span>${rich(g.title)}</span></summary>
          ${g.steps.map(s => `
            <div class="lp-step">
              <div><code>${esc(s.id)}</code> <strong>${rich(s.title)}</strong></div>
              <p>${rich(s.body)}</p>
              <div style="font-size:.75rem;color:var(--muted)">Uses: ${esc(s.uses.join(", "))} · Lean: <code>${esc(s.lean)}</code></div>
            </div>`).join("")}
        </details>`).join("")}`;
  } else if (state.claimTab === "review") {
    const comp = c.comparison;
    pane = `
      <div class="card" style="margin-bottom:.85rem">
        <p style="margin:0 0 .45rem"><strong>Direction Summary:</strong> ${esc(FIDELITY_SUMMARIES[c.id])}</p>
        <p style="margin:0 0 .65rem;font-size:.82rem;color:var(--muted)">${esc(comp.summary)}</p>
        <div style="display:flex;gap:.5rem;flex-wrap:wrap;align-items:center">
          <button class="btn primary" data-go-diff="${c.id}">Open Side-by-Side Highlighted Diff →</button>
          <span style="font-size:.76rem;color:var(--muted)">Hover any <strong>Lean vs. Paper</strong> badge below for its exact definition.</span>
        </div>
      </div>
      <div class="tbl-wrap">
        <table class="ledger">
          <thead><tr><th>Case</th><th>Lean vs. Paper Direction</th><th>Paper States</th><th>Lean Formalizes</th><th>Why / Assessment</th></tr></thead>
          <tbody>
            ${comp.cases.map(r => `<tr><td><strong>${esc(r.code)}</strong></td><td>${kindToken(r.kind)}</td><td>${esc(r.paper)}</td><td>${esc(r.lean)}</td><td style="color:var(--muted)">${esc(r.why)}</td></tr>`).join("")}
          </tbody>
        </table>
      </div>`;
  } else {
    pane = `
      <div class="card" style="margin-bottom:.8rem">
        <div style="display:flex;gap:.45rem;flex-wrap:wrap;margin-bottom:.6rem">
          ${chip("Declaration: " + c.declaration, "teal")}
          ${chip("🔒 SHA " + c.sha256.slice(0, 12), "slate", "Gate-1 frozen statement fingerprint.")}
          ${chip("Axioms: " + c.axioms.join(", "), "green")}
          ${chip("Witness: " + c.witness.split(".").pop(), "green", c.witness_note)}
        </div>
        <pre class="code">${hlLean(c.lean_source)}</pre>
      </div>
      <details>
        <summary style="font-weight:700;font-size:.82rem;color:var(--accent);cursor:pointer">Audited Totalized Lean Defaults (${c.defaults.length}/${c.defaults.length} Justified)</summary>
        <div class="tbl-wrap" style="margin-top:.55rem">
          <table class="ledger">
            <thead><tr><th>Operation</th><th>Constant</th><th>Status</th><th>Justification</th></tr></thead>
            <tbody>${c.defaults.map(d => `<tr><td><code>${esc(d.construct)}</code></td><td><code>${esc(d.constant)}</code> (${esc(d.file)} L${esc(d.line)})</td><td>${chip(d.status, "green")}</td><td>${esc(d.explanation || d.meaning)}</td></tr>`).join("")}</tbody>
          </table>
        </div>
      </details>`;
  }

  return `
    <div class="filter-bar">
      ${DATA.claims.map(cl => `<button class="f-btn" data-open-claim="${cl.id}" data-open-tab="${state.claimTab}" aria-pressed="${cl.id === c.id}">${esc(cl.reference)}</button>`).join("")}
    </div>
    <div class="card" style="margin-bottom:.9rem">
      <div style="font:700 .75rem/1 var(--mono);color:var(--accent)">${esc(c.reference)} · ${esc(c.paper_loc)}</div>
      <h2 style="margin:.25rem 0 .55rem;font-size:1.3rem">${rich(c.title)}</h2>
      <div style="display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.75rem">
        ${chip("✓ Lean Checked", "green", "Unconditional kernel theorem, standard axioms only.")}
        ${chip(c.basis === "lean" ? "⑂ Lean-Only Proof Route" : "≡ Aligned Proof", c.basis === "lean" ? "indigo" : "slate", c.basis_label)}
        ${chip("🔒 Frozen " + c.sha256.slice(0, 8), "slate")}
        ${chip(state.goldPreview ? "✓ Author Signed" : "⚠ Awaiting Human Sign-Off", state.goldPreview ? "green" : "coral")}
        ${c.comparison.result === "difference" ? chip("⚠ 5 Repairs", "coral") : chip("✓ Match", "green")}
      </div>
      <div class="filter-bar" style="margin-bottom:0">
        ${[["english","Plain English & Sketch"],["paper","Paper TeX"],["lamport","Lamport Proof"],["review","Semantic Review"],["lean","Lean 4 & Evidence"]].map(([k,l]) =>
          `<button class="f-btn" data-open-claim="${c.id}" data-open-tab="${k}" aria-pressed="${state.claimTab===k}">${l}</button>`).join("")}
      </div>
    </div>
    ${pane}`;
}

function render() {
  const q = curQuality();
  const topChip = document.getElementById("top-tier-chip");
  topChip.textContent = `${q.tier_badge} · ${q.score}`;
  topChip.className = `chip ${state.goldPreview ? "green" : "gold"}`;

  const totalGaps = DATA.claims.reduce((s, c) => s + c.comparison.counts.gap, 0);
  document.getElementById("diff-nav-badge").textContent = String(totalGaps);

  document.querySelectorAll(".subnav button").forEach(b => {
    if (b.dataset.view === state.view) b.setAttribute("aria-current", "page");
    else b.removeAttribute("aria-current");
  });

  const app = document.getElementById("app");
  if (state.view === "overview") app.innerHTML = renderOverview();
  else if (state.view === "ledger") app.innerHTML = renderLedger();
  else if (state.view === "diff") app.innerHTML = renderDiffWorkbench();
  else if (state.view === "graph") app.innerHTML = renderGraphView();
  else app.innerHTML = renderClaimInspector();

  bind();
}

function bind() {
  document.querySelectorAll("[data-go]").forEach(b => b.addEventListener("click", () => { state.view = b.dataset.go; render(); }));
  document.querySelectorAll("[data-go-gaps]").forEach(b => b.addEventListener("click", () => {
    state.diffClaim = "thm:qlalifo_delay"; state.diffFilter = "gap"; state.activeCase = "C11"; state.view = "diff"; render();
  }));
  document.querySelectorAll("[data-open-claim]").forEach(b => b.addEventListener("click", () => {
    state.claimId = b.dataset.openClaim;
    if (b.dataset.openTab) state.claimTab = b.dataset.openTab;
    state.view = "claim"; render();
    window.scrollTo({ top: 0, behavior: "smooth" });
  }));
  document.querySelectorAll("[data-go-diff]").forEach(b => b.addEventListener("click", () => {
    state.diffClaim = b.dataset.goDiff; state.activeCase = null; state.view = "diff"; render();
  }));
  document.querySelectorAll("[data-diff-claim]").forEach(b => b.addEventListener("click", () => {
    state.diffClaim = b.dataset.diffClaim; state.activeCase = null; render();
  }));
  document.querySelectorAll("[data-diff-filter]").forEach(b => b.addEventListener("click", () => {
    state.diffFilter = b.dataset.diffFilter; render();
  }));
  document.querySelectorAll("[data-pick-case]").forEach(el => el.addEventListener("click", () => {
    state.activeCase = el.dataset.pickCase; render();
  }));
  document.querySelectorAll("[data-jump-case]").forEach(tr => tr.addEventListener("click", () => {
    const [cid, code] = tr.dataset.jumpCase.split("|");
    state.diffClaim = cid; state.activeCase = code; render();
    window.scrollTo({ top: 140, behavior: "smooth" });
  }));
  document.querySelectorAll("[data-edge-kind]").forEach(b => b.addEventListener("click", () => {
    const k = b.dataset.edgeKind;
    if (k === "uses") return;
    state.graphEdges[k] = !state.graphEdges[k]; render();
  }));
  document.querySelectorAll("[data-node]").forEach(g => {
    g.addEventListener("click", () => { state.graphSel = g.dataset.node; render(); });
    g.addEventListener("dblclick", () => {
      const n = DATA.graph.nodes.find(x => x.id === g.dataset.node);
      if (n) { state.claimId = n.claim_id; state.claimTab = "english"; state.view = "claim"; render(); }
    });
  });
}

document.querySelectorAll(".subnav button").forEach(b => b.addEventListener("click", () => {
  state.view = b.dataset.view; render();
}));
document.getElementById("gold-toggle").addEventListener("change", e => { state.goldPreview = e.target.checked; render(); });

const dlg = document.getElementById("key-dialog");
document.getElementById("open-key").addEventListener("click", () => {
  const cite = DATA.quality.survey_citation;
  document.getElementById("key-body").innerHTML = `
    <h3 style="font-size:.92rem;margin:0 0 .4rem">Semantic Comparison Tokens (Lean vs. Paper Direction)</h3>
    <p style="margin:0 0 .5rem;color:var(--muted);font-size:.8rem">Every semantic label states explicitly which side (Lean or Paper) is stronger, narrower, or adds an assumption:</p>
    ${Object.entries(KIND_INFO).map(([, v]) => `
      <div style="display:grid;grid-template-columns:15.5rem 1fr;gap:.75rem;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.8rem;align-items:baseline">
        <div><span class="sem-token sem-${v.polarity}">${esc(v.label)}</span></div>
        <div style="color:var(--muted)">${esc(v.tip)}</div>
      </div>`).join("")}
    <h3 style="font-size:.92rem;margin:1rem 0 .4rem">Verification Badges</h3>
    ${DATA.badges.map(b => `<div style="display:grid;grid-template-columns:15.5rem 1fr;gap:.75rem;padding:.35rem 0;border-bottom:1px solid var(--line);font-size:.8rem"><div>${chip(b.label, b.tone)}</div><div style="color:var(--muted)">${esc(b.short)}</div></div>`).join("")}
    <p style="margin:.9rem 0 0;font-size:.8rem"><strong>Research Citation:</strong> ${esc(cite.authors)} — <em>${esc(cite.title)}</em> · <a href="${cite.repo_url}" target="_blank" rel="noopener">GitHub Repo ↗</a></p>`;
  dlg.showModal();
});
document.getElementById("close-key").addEventListener("click", () => dlg.close());
dlg.addEventListener("click", e => { if (e.target === dlg) dlg.close(); });

window.addEventListener("load", () => render());
render();
</script>
</body>
</html>
