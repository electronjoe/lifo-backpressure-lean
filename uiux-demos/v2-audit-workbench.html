<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Proof Atlas (Rev B · Audit Workbench) — LIFO-Backpressure</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js"></script>
<style>
:root {
  --bg: #f4f6f9;
  --surface: #ffffff;
  --subtle: #eef2f6;
  --ink: #0f172a;
  --muted: #475569;
  --line: #d6dee8;
  --accent: #0f62fe;
  --accent-soft: #e8f0ff;
  --green: #146c43;
  --green-bg: #e7f6ee;
  --green-bd: #9fd7ba;
  --teal: #0b6374;
  --teal-bg: #e6f5f8;
  --teal-bd: #95ceda;
  --amber: #945800;
  --amber-bg: #fff5df;
  --amber-bd: #ebd08d;
  --coral: #b42318;
  --coral-bg: #fef0ee;
  --coral-bd: #f0b4ae;
  --indigo: #4338ca;
  --indigo-bg: #eef2ff;
  --indigo-bd: #c7d2fe;
  --gold: #855800;
  --gold-bg: #fef6d8;
  --gold-bd: #e7c766;
  --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, Roboto, sans-serif;
  --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
}
* { box-sizing: border-box; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 14.5px/1.55 var(--sans); -webkit-font-smoothing: antialiased;
}
[hidden] { display: none !important; }
a { color: var(--accent); text-underline-offset: 2px; }
button { font: inherit; cursor: pointer; }
code { font-family: var(--mono); font-size: .88em; background: var(--subtle); padding: .08rem .3rem; border-radius: 4px; }

/* Header */
.topbar {
  background: #0f172a; color: #f8fafc;
  border-bottom: 1px solid #1e293b;
}
.topbar-in {
  max-width: 82rem; margin: auto; padding: .85rem 1.5rem;
  display: flex; align-items: center; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
}
.tb-title h1 { margin: 0; font-size: 1.1rem; font-weight: 700; letter-spacing: -.01em; display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
.tb-title p { margin: .18rem 0 0; font-size: .78rem; color: #94a3b8; }
.tb-actions { display: flex; align-items: center; gap: .65rem; flex-wrap: wrap; }
.tb-pill {
  background: #1e293b; border: 1px solid #334155; color: #e2e8f0;
  font-size: .76rem; font-weight: 600; padding: .34rem .72rem; border-radius: 999px;
  display: inline-flex; align-items: center; gap: .4rem; text-decoration: none;
}
.tb-pill:hover { border-color: #64748b; }
.tb-pill input { margin: 0; accent-color: #22c55e; cursor: pointer; }

/* Sticky Primary Navigation (Single Clean Tab Bar — No Redundant Role Toggle) */
.subnav {
  background: var(--surface); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 20;
}
.subnav-in {
  max-width: 82rem; margin: auto; padding: 0 1.5rem;
  display: flex; gap: .25rem; align-items: center; overflow-x: auto;
}
.subnav button {
  background: none; border: none; padding: .76rem 1rem; white-space: nowrap;
  font-size: .85rem; font-weight: 600; color: var(--muted);
  border-bottom: 2.5px solid transparent; display: inline-flex; align-items: center; gap: .4rem;
}
.subnav button:hover { color: var(--ink); }
.subnav button[aria-current="page"] { color: var(--accent); border-bottom-color: var(--accent); }
.nav-count {
  font-size: .7rem; font-weight: 700; padding: .08rem .4rem; border-radius: 999px;
  background: var(--coral-bg); color: var(--coral); border: 1px solid var(--coral-bd);
}

/* Container */
.wrap { max-width: 82rem; margin: auto; padding: 1.35rem 1.5rem 4rem; }

/* Chips & Instant Tooltips */
.chip {
  position: relative; display: inline-flex; align-items: center; gap: .28rem;
  padding: .15rem .52rem; border-radius: 6px; font-size: .73rem; font-weight: 600;
  border: 1px solid var(--line); background: var(--surface); color: var(--ink); white-space: nowrap;
}
.chip.green { background: var(--green-bg); border-color: var(--green-bd); color: var(--green); }
.chip.teal { background: var(--teal-bg); border-color: var(--teal-bd); color: var(--teal); }
.chip.amber { background: var(--amber-bg); border-color: var(--amber-bd); color: var(--amber); }
.chip.coral { background: var(--coral-bg); border-color: var(--coral-bd); color: var(--coral); }
.chip.indigo { background: var(--indigo-bg); border-color: var(--indigo-bd); color: var(--indigo); }
.chip.gold { background: var(--gold-bg); border-color: var(--gold-bd); color: var(--gold); }
.chip.slate { background: var(--subtle); border-color: var(--line); color: var(--muted); }
.chip[data-tip], .sem-span[data-tip] { cursor: help; }
.chip[data-tip]::after, .sem-span[data-tip]::after {
  content: attr(data-tip); position: absolute; left: 50%; bottom: calc(100% + 7px);
  transform: translateX(-50%); width: max-content; max-width: 280px; white-space: normal;
  background: #0f172a; color: #f8fafc; font-weight: 400; font-size: .73rem; line-height: 1.42;
  padding: .48rem .68rem; border-radius: 6px; box-shadow: 0 8px 24px rgba(15,23,42,.28);
  opacity: 0; pointer-events: none; transition: opacity .13s; z-index: 70; text-align: left;
}
.chip[data-tip]:hover::after, .chip[data-tip]:focus::after,
.sem-span[data-tip]:hover::after, .sem-span[data-tip]:focus::after { opacity: 1; }

/* Prominent Human Sign-Off Trust Banner */
.trust-banner {
  border-radius: 10px; padding: .95rem 1.15rem; margin-bottom: 1.15rem;
  display: flex; align-items: flex-start; justify-content: space-between; gap: 1rem; flex-wrap: wrap;
}
.trust-banner.pending {
  background: linear-gradient(90deg, #fff8eb 0%, #fef2f0 100%);
  border: 1.5px solid #e6a86a; border-left: 5px solid var(--coral);
}
.trust-banner.signed {
  background: var(--green-bg); border: 1.5px solid var(--green-bd); border-left: 5px solid var(--green);
}
.trust-banner h2 { margin: 0 0 .25rem; font-size: .98rem; display: flex; align-items: center; gap: .5rem; flex-wrap: wrap; }
.trust-banner p { margin: 0; font-size: .84rem; color: var(--ink); max-width: 78ch; line-height: 1.5; }
.trust-actions { display: flex; gap: .45rem; flex-wrap: wrap; align-items: center; margin-top: .55rem; }

/* Cards & KPI Grid */
.kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: .85rem; margin-bottom: 1.25rem; }
.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.1rem;
}
.kpi .k { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); }
.kpi .v { font-size: 1.5rem; font-weight: 800; letter-spacing: -.03em; margin: .2rem 0 .25rem; }
.kpi .d { font-size: .77rem; color: var(--muted); line-height: 1.4; }

/* TINA-style Stacked Bar */
.stack { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--subtle); gap: 2px; margin: .6rem 0; }
.stack > span { display: block; height: 100%; }

/* Tables */
.tbl-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
table.ledger { width: 100%; border-collapse: collapse; font-size: .82rem; }
table.ledger th, table.ledger td { padding: .62rem .75rem; border-bottom: 1px solid var(--line); text-align: left; vertical-align: top; }
table.ledger thead th { background: var(--subtle); font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
table.ledger tbody tr:last-child td { border-bottom: none; }
table.ledger tbody tr:hover { background: #f8fafc; }
.cell-good { color: #0f5132; background: rgba(231, 246, 238, .45); }
.cell-work { color: #7c3f00; background: rgba(255, 245, 223, .55); }
.cell-done { color: var(--green); font-weight: 600; }

/* Action Plan Cards */
.plan-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: .75rem; margin-top: .75rem; }
.plan-item {
  border: 1px solid var(--line); border-radius: 9px; padding: .8rem .95rem; background: var(--bg);
}
.plan-item.done { background: var(--green-bg); border-color: var(--green-bd); }
.plan-head { display: flex; align-items: center; justify-content: space-between; gap: .5rem; flex-wrap: wrap; margin-bottom: .35rem; }
.plan-item h4 { margin: 0 0 .3rem; font-size: .88rem; }
.plan-item p { margin: 0; font-size: .79rem; color: var(--muted); line-height: 1.45; }

/* Section titles */
.sh { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin: 1.4rem 0 .6rem; flex-wrap: wrap; }
.sh h2 { margin: 0; font-size: 1.08rem; font-weight: 700; }
.sh span { font-size: .78rem; color: var(--muted); }

/* Paper Story Card */
.story-grid { display: grid; grid-template-columns: 1.1fr 1fr; gap: 1.25rem; align-items: center; }
.story-grid img { width: 100%; max-height: 16.5rem; object-fit: contain; border: 1px solid var(--line); border-radius: 8px; padding: .3rem; background: #fff; }

/* Theorem Callout Strips (Theorem 2 Lean-Only Route & Theorem 4 Repairs) */
.route-callout {
  margin-top: .55rem; padding: .55rem .72rem; border-radius: 7px; font-size: .78rem; line-height: 1.45;
  background: var(--indigo-bg); border: 1px solid var(--indigo-bd); color: #1e1b4b;
}
.repair-callout {
  margin-top: .55rem; padding: .55rem .72rem; border-radius: 7px; font-size: .78rem; line-height: 1.45;
  background: var(--coral-bg); border: 1px solid var(--coral-bd); color: #7f1d1d;
}

/* Semantic Diff Workbench & Directional Tokens */
.filter-bar { display: flex; gap: .4rem; flex-wrap: wrap; margin-bottom: .9rem; align-items: center; }
.f-btn {
  background: var(--surface); border: 1px solid var(--line); color: var(--muted);
  font-size: .78rem; font-weight: 600; padding: .34rem .7rem; border-radius: 999px;
}
.f-btn[aria-pressed="true"] { background: var(--ink); color: #fff; border-color: var(--ink); }
.sem-agrees { background: var(--green-bg); border-bottom: 2px solid var(--green-bd); color: #0f5132; }
.sem-stronger { background: var(--teal-bg); border-bottom: 2px solid var(--teal-bd); color: #084c59; }
.sem-nuance { background: var(--amber-bg); border-bottom: 2px solid var(--amber-bd); color: #6b3f00; }
.sem-gap { background: var(--coral-bg); border-bottom: 2px solid var(--coral-bd); color: #8c1c13; }
.sem-span {
  position: relative; display: inline; padding: .06rem .26rem; border-radius: 4px;
  cursor: pointer; font-weight: 500;
}
.sem-token {
  position: relative; display: inline-flex; align-items: center; gap: .25rem;
  padding: .15rem .48rem; border-radius: 5px; font-size: .73rem; font-weight: 700;
  white-space: nowrap; cursor: help;
}
.sem-token[data-tip]::after {
  content: attr(data-tip); position: absolute; left: 0; bottom: calc(100% + 7px);
  width: max-content; max-width: 290px; white-space: normal;
  background: #0f172a; color: #f8fafc; font-weight: 400; font-size: .73rem; line-height: 1.42;
  padding: .48rem .68rem; border-radius: 6px; box-shadow: 0 8px 24px rgba(15,23,42,.28);
  opacity: 0; pointer-events: none; transition: opacity .13s; z-index: 70; text-align: left;
}
.sem-token[data-tip]:hover::after, .sem-token[data-tip]:focus::after { opacity: 1; }
.sem-span.active { outline: 2px solid var(--ink); font-weight: 700; }
.side-by-side { display: grid; grid-template-columns: 1fr 1fr; gap: .9rem; margin-bottom: .9rem; }
.patch-line { font: 400 .78rem/1.45 var(--mono); padding: .42rem .6rem; border-radius: 6px; margin: .3rem 0; white-space: pre-wrap; word-break: break-word; }
.patch-del { background: var(--coral-bg); color: #8c1c13; border-left: 3px solid var(--coral); }
.patch-add { background: var(--green-bg); color: #0f5132; border-left: 3px solid var(--green); }

/* Graph */
.graph-layout { display: grid; grid-template-columns: minmax(0, 1fr) 21.5rem; gap: 1rem; align-items: start; }
.graph-box { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.graph-svg { width: 100%; height: 540px; display: block; background: linear-gradient(90deg, rgba(214,222,232,.25) 1px, transparent 1px) 0 0 / 24px 24px, linear-gradient(rgba(214,222,232,.25) 1px, transparent 1px) 0 0 / 24px 24px; }
.ge { fill: none; stroke-width: 1.8; transition: opacity .15s; }
.ge.uses { stroke: #0f172a; stroke-width: 2.3; }
.ge.setup { stroke: #64748b; stroke-dasharray: 5 4; }
.ge.routine { stroke: #0b6374; stroke-dasharray: 2 3; }
.ge.witness { stroke: #146c43; stroke-dasharray: 7 3 2 3; }
.ge.dim { opacity: .13; }
.ge.hot { opacity: 1; stroke-width: 2.8; }
.gn { cursor: pointer; transition: opacity .15s; }
.gn.dim { opacity: .2; }
.gn rect.box { fill: #fff; stroke: #cbd5e1; stroke-width: 1.5; }
.gn.layer-theorem rect.box { stroke: var(--green); stroke-width: 1.8; }
.gn.status-verified_diff rect.box { stroke: var(--coral); stroke-width: 2.1; }
.gn.status-frozen_repair rect.box { stroke: var(--coral); stroke-dasharray: 4 2; }
.gn.layer-setup rect.box { fill: #f8fafc; stroke: #94a3b8; }
.gn.layer-routine rect.box { fill: #f0f9ff; stroke: #38bdf8; }
.gn.layer-witness rect.box { fill: #f0fdf4; stroke: #4ade80; }
.gn.sel rect.box { stroke: var(--accent); stroke-width: 2.8; filter: drop-shadow(0 3px 10px rgba(15,98,254,.22)); }

/* Lamport Tree */
.lp-card { border: 1px solid var(--line); border-radius: 9px; background: var(--surface); margin-bottom: .65rem; overflow: hidden; }
.lp-card summary { padding: .65rem .9rem; background: var(--subtle); font-weight: 700; cursor: pointer; list-style: none; display: flex; align-items: center; gap: .55rem; }
.lp-card summary::-webkit-details-marker { display: none; }
.lp-tag { font: 700 .75rem/1 var(--mono); color: var(--accent); background: #fff; border: 1px solid var(--line); padding: .18rem .4rem; border-radius: 5px; }
.lp-step { padding: .65rem .9rem .65rem 1rem; border-top: 1px solid var(--line); }
.lp-step p { margin: .25rem 0; }

pre.code {
  background: #0f172a; color: #e2e8f0; padding: .95rem 1.1rem; border-radius: 8px;
  overflow-x: auto; font: 400 .78rem/1.5 var(--mono); margin: .6rem 0;
}
.ck { color: #7dd3fc; font-weight: 600; }
.cc { color: #94a3b8; font-style: italic; }

.btn {
  background: var(--surface); border: 1px solid var(--line); color: var(--ink);
  font-size: .78rem; font-weight: 600; padding: .38rem .75rem; border-radius: 7px;
  text-decoration: none; display: inline-flex; align-items: center; gap: .35rem;
}
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { filter: brightness(.92); }
.btn.warn { background: var(--coral); border-color: var(--coral); color: #fff; }
.btn.warn:hover { filter: brightness(.92); }

dialog {
  width: min(50rem, calc(100% - 2rem)); max-height: 86vh; border: 1px solid var(--line);
  border-radius: 12px; padding: 1.3rem 1.5rem; box-shadow: 0 20px 50px rgba(15,23,42,.3);
}
dialog::backdrop { background: rgba(15,23,42,.5); }

@media (max-width: 960px) {
  .kpi-grid, .story-grid, .side-by-side, .graph-layout, .plan-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="topbar">
  <div class="topbar-in">
    <div class="tb-title">
      <h1>LIFO-Backpressure Proof Atlas <span class="chip gold" id="top-tier-chip"></span></h1>
      <p>Huang, Moeller, Neely &amp; Krishnamachari (arXiv:1008.4895v2) · Lean v4.33.1 · Commit 082a04d · Rubric: survey-lean-proofs-eng-arxiv</p>
    </div>
    <div class="tb-actions">
      <label class="tb-pill" title="Compare honest live repo status vs. Full Tier 3 Gold after human sign-off & paranoid CI">
        <input type="checkbox" id="gold-toggle">
        <span>Preview Full Tier 3 Gold</span>
      </label>
      <button class="tb-pill" id="open-key">ⓘ Badge &amp; Polarity Key</button>
    </div>
  </div>
</header>

<nav class="subnav" aria-label="Workbench views">
  <div class="subnav-in">
    <button data-view="overview" aria-current="page">Overview &amp; Quality</button>
    <button data-view="ledger">Results Ledger</button>
    <button data-view="diff">Semantic Diff &amp; Edits <span class="nav-count" id="diff-nav-badge">8</span></button>
    <button data-view="graph">Layered DAG</button>
    <button data-view="claim">Claim Inspector</button>
  </div>
</nav>

<main class="wrap" id="app"></main>

<dialog id="key-dialog">
  <div style="display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding-bottom:.65rem;margin-bottom:.9rem">
    <h2 style="margin:0;font-size:1.1rem">Status Badges, Semantic Polarity Direction &amp; Rubric</h2>
    <button class="btn" id="close-key">Close ✕</button>
  </div>
  <div id="key-body"></div>

slot band, not on the huge base backlog sitting underneath it.", "proof_sketch": "Fix any good sample path where both hypotheses hold. Because each buffer slot holds at most one job at a time, the total time all departing jobs combined spend inside any single slot up to time $t$ cannot exceed $t$; summing over all $|\\mathcal{B}|$ slots bounds total departing delay by $|\\mathcal{B}|\\cdot t$. Meanwhile, at time $t$ at most $|\\mathcal{B}|$ arrived jobs can still be sitting in $\\mathcal{B}$, so departures satisfy $D(t) \\ge N(t) - |\\mathcal{B}|$. Dividing the delay upper bound by $D(t)$ and taking $\\limsup_{t\\to\\infty}$ immediately gives $|\\mathcal{B}| / \\lambda_{\\min}$.", "paper_statement_html": "Suppose there is a constant $\\lambda_{\\min} > 0$ such that with probability 1, $\\liminf_{t\\to\\infty} \\frac{N(t)}{t} \\ge \\lambda_{\\min}$, and further suppose $\\lim_{t\\to\\infty} D(t) = \\infty$ with probability 1. Then the average delay $\\overline{W}$ of departing jobs from $\\mathcal{B}$ satisfies $$\\overline{W} \\triangleq \\limsup_{t\\to\\infty} \\frac{1}{D(t)}\\sum_{i=1}^{D(t)} W_i \\le \\frac{|\\mathcal{B}|}{\\lambda_{\\min}}.$$", "paper_tex": "\\subsection{A Modified Little's Theorem for LIFO systems} \\label{section:LIFO-little}\nWe now present the modified Little's theorem. \nLet $\\script{B}$ represent a finite set of buffer locations for a LIFO queueing system. \nLet $N(t)$ be the number of arrivals that use a buffer\nlocation within set $\\script{B}$ up to time $t$.  Let $D(t)$ be the number of departures from a buffer location within the set \n$\\script{B}$ up to time $t$.  Let $W_i$ be the delay of the $i$th job to depart from the set $\\script{B}$.  Define $\\overline{W}$ as the\n$\\limsup$ average delay \\emph{considering only those jobs that depart}: \n\\[ \\overline{W} \\defequiv \\limsup_{t\\rightarrow\\infty} \\frac{1}{D(t)}\\sum_{i=1}^{D(t)} W_i. \\]\nWe then have the following theorem: \n\\begin{thm} \\label{theorem:little1} \nSuppose there is a constant $\\lambda_{min}>0$ such that with probability 1: \n\\[ \\liminf_{t\\rightarrow\\infty} \\frac{N(t)}{t} \\geq \\lambda_{min}, \\]\nFurther suppose that $\\lim_{t\\rightarrow\\infty} D(t) = \\infty$ with probability 1 (so the number of departures is infinite). \nThen the average delay $\\overline{W}$ satisfies: \n\\[ \\overline{W} \\defequiv \\limsup_{t\\rightarrow\\infty} \\frac{1}{D(t)}\\sum_{i=1}^{D(t)} W_i \\leq |\\script{B}|/\\lambda_{min}, \\]\nwhere $|\\script{B}|$ is the size of the finite set $\\script{B}$. \n\\end{thm} \n\\begin{proof}\nSee Appendix A. \n\\end{proof}", "routine_deps": [], "setup_deps": ["S1"], "witness_node": "W1", "edits": ["thm1-discrete-time-sum"], "declaration": "Assembly.theorem_little1", "expected": "LifoBackpressure.Statements.Theorem1Statement", "axioms": ["propext", "Classical.choice", "Quot.sound"], "sha256": "a8ad5d7381c2dd637dbf4f32e75e20089ff546149c3212dbb97f47ba49d3a67f", "lean_source": "import Prelude\n\n/-!\n# Statements for Theorem 1 (`theorem:little1`): Modified Little's Theorem for LIFO Systems\n\nFormalizes the sample-path and almost-sure discrete-time LIFO buffer-slot model and\nTheorem 1 of Huang, Moeller, Neely, and Krishnamachari (`arXiv:1008.4895v2`, Section VI-B,\nlines 517-531; proof in Appendix A, lines 1019-1080).\n-/\n\nnamespace LifoBackpressure.Statements\n\nopen Filter MeasureTheory\n\n/-- A discrete-time sample path of jobs entering a finite set `B` of single-occupancy\nbuffer locations where each job stays in its assigned buffer slot from arrival until\ndeparture (as under the LIFO discipline). -/\nstructure BufferSystem (B : Type*) [Fintype B] (ι : Type*) where\n  /-- Discrete arrival time slot of job `k`. -/\n  arrival : ι → ℕ\n  /-- Departure time slot of job `k`, or `⊤` if the job never departs. -/\n  depart : ι → WithTop ℕ\n  /-- Fixed buffer location in `B` occupied by job `k`. -/\n  slot : ι → B\n  /-- No job departs before it arrives. -/\n  arrival_le_depart : ∀ k, (arrival k : WithTop ℕ) ≤ depart k\n  /-- Only finitely many jobs arrive before any finite horizon `t`. -/\n  finite_arrivals : ∀ t : ℕ, Set.Finite {k : ι | arrival k < t}\n  /-- Each buffer location holds at most one job at any time slot `τ`. -/\n  disjoint_slots :\n    ∀ k₁ k₂, k₁ ≠ k₂ → slot k₁ = slot k₂ →\n      ∀ τ : ℕ, ¬ ((arrival k₁ ≤ τ ∧ (τ : WithTop ℕ) < depart k₁) ∧\n                   (arrival k₂ ≤ τ ∧ (τ : WithTop ℕ) < depart k₂))\n\nnamespace BufferSystem\n\nvariable {B : Type*} [Fintype B] {ι : Type*}\n\n/-- Jobs that arrive strictly before time `t`. -/\ndef arrivalsSet (sys : BufferSystem B ι) (t : ℕ) : Set ι :=\n  {k | sys.arrival k < t}\n\n/-- Jobs that depart up to (and including) time `t`. -/\ndef departuresSet (sys : BufferSystem B ι) (t : ℕ) : Set ι :=\n  {k | sys.depart k ≤ (t : WithTop ℕ)}\n\n/-- Only finitely many jobs depart by time `t`, since every departing job arrived by time `t`. -/\nlemma finite_departures (sys : BufferSystem B ι) (t : ℕ) :\n    Set.Finite (sys.departuresSet t) := by\n  apply (sys.finite_arrivals (t + 1)).subset\n  intro k hk\n  have hle : (sys.arrival k : WithTop ℕ) ≤ (t : WithTop ℕ) :=\n    le_trans (sys.arrival_le_depart k) hk\n  have hleNat : sys.arrival k ≤ t := by exact_mod_cast hle\n  exact Nat.lt_succ_of_le hleNat\n\n/-- Number `N(t)` of arrivals into `B` up to time `t`. -/\nnoncomputable def arrivalsCount (sys : BufferSystem B ι) (t : ℕ) : ℕ :=\n  (sys.finite_arrivals t).toFinset.card\n\n/-- Number `D(t)` of departures from `B` up to time `t`. -/\nnoncomputable def departuresCount (sys : BufferSystem B ι) (t : ℕ) : ℕ :=\n  (sys.finite_departures t).toFinset.card\n\n/-- Delay `W_k` of job `k` (equals `d - arrival k` when `depart k = d`, and `0` if `depart k = ⊤`). -/\ndef jobDelay (sys : BufferSystem B ι) (k : ι) : ℕ :=\n  match sys.depart k with\n  | some d => d - sys.arrival k\n  | none => 0\n\n/-- Total delay `∑_{i=1}^{D(t)} W_i` of all jobs that depart from `B` by time `t`. -/\nnoncomputable def totalDelay (sys : BufferSystem B ι) (t : ℕ) : ℕ :=\n  ∑ k ∈ (sys.finite_departures t).toFinset, sys.jobDelay k\n\n/-- Empirical average delay `(1 / D(t)) ∑_{i=1}^{D(t)} W_i` of jobs departing by time `t`. -/\nnoncomputable def avgDelay (sys : BufferSystem B ι) (t : ℕ) : ℝ :=\n  (sys.totalDelay t : ℝ) / (sys.departuresCount t : ℝ)\n\n/-- Restrict a buffer system to any subset `S` of jobs (e.g., packets arriving while queue\nbacklog lies in a target window `B_j`). -/\ndef restrict (sys : BufferSystem B ι) (S : Set ι) : BufferSystem B {k : ι // k ∈ S} where\n  arrival k := sys.arrival k.1\n  depart k := sys.depart k.1\n  slot k := sys.slot k.1\n  arrival_le_depart k := sys.arrival_le_depart k.1\n  finite_arrivals t :=\n    (sys.finite_arrivals t).preimage (fun _ _ _ _ h => Subtype.ext h)\n  disjoint_slots k₁ k₂ hne hsl τ :=\n    sys.disjoint_slots k₁.1 k₂.1 (fun h => hne (Subtype.ext h)) hsl τ\n\nend BufferSystem\n\n/-- Paper Theorem 1 (`theorem:little1`): Modified Little's Theorem for LIFO systems.\nIf with probability 1 the `liminf` arrival rate into a finite buffer set `B` is at least\n`λ_min > 0` and infinitely many jobs depart (`D(t) → ∞`), then with probability 1 the\n`limsup` average delay of departing jobs is at most `|B| / λ_min`. -/\ndef Theorem1Statement : Prop :=\n  ∀ (B : Type) [Fintype B] (ι : Type) (Ω : Type) [MeasurableSpace Ω]\n    (μ : Measure Ω) [IsProbabilityMeasure μ]\n    (sys : Ω → BufferSystem B ι) (lamMin : ℝ),\n    0 < lamMin →\n    (∀ᵐ ω ∂μ, (lamMin : EReal) ≤\n      Filter.liminf (fun t : ℕ => (((sys ω).arrivalsCount t : ℝ) / (t : ℝ) : EReal)) Filter.atTop) →\n    (∀ᵐ ω ∂μ, Filter.Tendsto (fun t : ℕ => (sys ω).departuresCount t) Filter.atTop Filter.atTop) →\n    (∀ᵐ ω ∂μ,\n      Filter.limsup (fun t : ℕ => ((sys ω).avgDelay t : EReal)) Filter.atTop ≤\n        (((Fintype.card B : ℝ) / lamMin : ℝ) : EReal))\n\nend LifoBackpressure.Statements\n", "comparison": {"result": "match", "summary": "LifoBackpressure.Statements.Theorem1Statement matches Paper Theorem 1 (theorem:little1) across all 7 numbered obligations (C1-C7) in the paper's slotted discrete-time setting. It formalizes the fixed-slot single-occupancy buffer discipline on a finite slot set B, keeps both almost-sure hypotheses (liminf N(t)/t >= lambda_min > 0 and D(t) -> infinity), and concludes the exact almost-sure delay upper bound limsup avgDelay(t) <= |B| / lambda_min. The only modeling choice is fixing discrete time t in N (matching Section III and Theorem 4) rather than the continuous-time integral notation written in Appendix A.", "scope": "Covers Paper Theorem 1 in full for discrete slotted-time fixed-slot single-occupancy buffer systems (including all LIFO systems in the paper and Theorem 4's application). Does not formalize continuous-time arrival/departure timestamps in R_+. All noncomputable definitions (arrivalsCount, departuresCount, totalDelay, avgDelay) use classical Set.Finite.toFinset and do not conflict with any algorithmic claim in the paper; all external dependencies are standard Mathlib/Lean packages.", "advice": "Recommend approval if discrete slotted time (matching Section III and Theorem 4) is the intended scope of Theorem 1; flag a difference only if you specifically want Theorem 1 stated for continuous-time arrival/departure timestamps in R_+.", "stronger_result": null, "issue": null, "cases": [{"code": "C1", "case": "C1: Finite buffer set B and probability space", "kind": "agrees", "polarity": "agrees", "paper": "Finite set B of buffer locations with cardinality |B| on a probability space (L517, L530).", "lean": "Quantifies over (B : Type) [Fintype B], (ι : Type), (Ω : Type) [MeasurableSpace Ω], (μ : Measure Ω) [IsProbabilityMeasure μ], and (sys : Ω → BufferSystem B ι), using Fintype.card B for |B|.", "why": "Exact formalization of a finite buffer set and probability space; any empty B makes N(t) = 0 and vacuously falsifies liminf N(t)/t >= lamMin > 0, while nonempty B covers all nontrivial systems."}, {"code": "C2", "case": "C2: Arrival count N(t), departure count D(t), delays W_i, and empirical average delay", "kind": "agrees", "polarity": "agrees", "paper": "N(t) arrivals into B up to time t; D(t) departures from B up to time t; W_i delay of i-th departing job; W_bar := limsup_{t -> infinity} (1 / D(t)) sum_{i=1}^{D(t)} W_i (L518-L522, L529).", "lean": "arrivalsCount t = |{k | arrival k < t}|, departuresCount t = |{k | depart k <= t}|, totalDelay t = sum_{k : depart k <= t} jobDelay k, avgDelay t = totalDelay t / departuresCount t, and Filter.limsup (fun t => (avgDelay t : EReal)) Filter.atTop.", "why": "Using arrival < t (slots 0..t-1) and depart <= t aligns with discrete t-slot horizon sums (any job arriving before t and not departing by t occupies a slot at time t, so D(t) >= N(t) - |B|, and every job departing by t has occupancy interval inside [0, t)). Shifting t by 1 leaves liminf N(t)/t and limsup avgDelay(t) unchanged."}, {"code": "C3", "case": "C3: Fixed-slot single-occupancy buffer discipline", "kind": "agrees", "polarity": "agrees", "paper": "Each slot b in B has occupancy Q^(b)(t) in {0, 1}, and a job entering slot b stays in b until departure, giving D(t) >= N(t) - |B| (L217, L1024-L1029, L1072-L1073).", "lean": "BufferSystem fixes slot : ι → B per job, enforces arrival_le_depart, finite_arrivals for every horizon t, and disjoint_slots stating no two distinct jobs in the same slot can both satisfy arrival <= τ < depart at any slot τ.", "why": "Captures the exact single-occupancy fixed-slot invariant used by Appendix A's proof (note neither Appendix A nor Lean needs LIFO ordering specifically beyond fixed-slot single occupancy)."}, {"code": "C4", "case": "C4: Discrete slotted time domain vs Appendix A continuous-time integral", "kind": "chosen reading", "polarity": "nuance", "paper": "Section III operates in slotted discrete time t in N (L281), whereas Appendix A writes the proof inequality using a continuous integral int_0^t Q^(b)(tau) d tau (L1028) with nonnegative delays W_i >= 0.", "lean": "Fixes discrete time: arrival : ι → ℕ, depart : ι → WithTop ℕ, time horizon t : ℕ, and jobDelay k : ℕ.", "why": "Lean adopts the paper's Section III discrete slotted-time model (which is also the exact form invoked in Theorem 4) rather than generalizing Theorem 1 to continuous-time arrival/departure epochs in R_+."}, {"code": "C5", "case": "C5: Positive arrival-rate lower bound", "kind": "agrees", "polarity": "agrees", "paper": "There exists a constant lambda_min > 0 such that with probability 1, liminf_{t -> infinity} N(t)/t >= lambda_min (L525-L526).", "lean": "0 < lamMin and ∀ᵐ ω ∂μ, (lamMin : EReal) ≤ Filter.liminf (fun t : ℕ => (((sys ω).arrivalsCount t : ℝ) / (t : ℝ) : EReal)) Filter.atTop.", "why": "Exact correspondence in EReal, which avoids any artificial real-valued liminf default if N(t)/t is unbounded above."}, {"code": "C6", "case": "C6: Infinitely many departures", "kind": "agrees", "polarity": "agrees", "paper": "lim_{t -> infinity} D(t) = infinity with probability 1 (L527).", "lean": "∀ᵐ ω ∂μ, Filter.Tendsto (fun t : ℕ => (sys ω).departuresCount t) Filter.atTop Filter.atTop.", "why": "Exact formalization of D(t) -> infinity almost surely."}, {"code": "C7", "case": "C7: Almost-sure average delay upper bound", "kind": "agrees", "polarity": "agrees", "paper": "W_bar <= |B| / lambda_min with probability 1 (L528-L530, L1022-L1023).", "lean": "∀ᵐ ω ∂μ, Filter.limsup (fun t : ℕ => ((sys ω).avgDelay t : EReal)) Filter.atTop ≤ (((Fintype.card B : ℝ) / lamMin : ℝ) : EReal).", "why": "Exact match of the conclusion inequality in EReal."}], "counts": {"agrees": 6, "stronger": 0, "nuance": 1, "gap": 0}, "paper_spans": [{"text": "Consider a LIFO queueing system with a "}, {"text": "finite set $\\mathcal{B}$ of buffer locations (size $|\\mathcal{B}|$)", "case": "C1", "polarity": "agrees"}, {"text": ", where "}, {"text": "each slot holds at most one job and a job remains in its assigned slot until departure", "case": "C3", "polarity": "agrees"}, {"text": " (proved in Appendix A using "}, {"text": "continuous-time integral $\\int_0^t Q^{(b)}(\\tau)\\,d\\tau$", "case": "C4", "polarity": "nuance"}, {"text": "). Let "}, {"text": "$N(t)$ be arrivals into $\\mathcal{B}$, $D(t)$ departures, and $W_i$ individual delays", "case": "C2", "polarity": "agrees"}, {"text": ". Assume with probability 1 that "}, {"text": "$\\liminf_{t\\to\\infty} N(t)/t \\ge \\lambda_{\\min} > 0$", "case": "C5", "polarity": "agrees"}, {"text": " and "}, {"text": "$\\lim_{t\\to\\infty} D(t) = \\infty$", "case": "C6", "polarity": "agrees"}, {"text": ". Then with probability 1, "}, {"text": "$\\overline{W} := \\limsup_{t\\to\\infty} \\frac{1}{D(t)}\\sum_{i=1}^{D(t)} W_i \\le |\\mathcal{B}| / \\lambda_{\\min}$", "case": "C7", "polarity": "agrees"}, {"text": "."}], "lean_spans": [{"text": "For any "}, {"text": "finite type `B` (`Fintype.card B`) and probability space `(\\Omega, \\mu)`", "case": "C1", "polarity": "agrees"}, {"text": ", let `sys : \\Omega \\to BufferSystem B \\iota` assign each job "}, {"text": "discrete time slots `arrival : \\iota \\to \\mathbb{N}`, `depart : \\iota \\to WithTop \\mathbb{N}`", "case": "C4", "polarity": "nuance"}, {"text": " and a "}, {"text": "fixed slot `slot : \\iota \\to B` with pairwise disjoint residency intervals $[a_k, d_k)$", "case": "C3", "polarity": "agrees"}, {"text": ". Defining "}, {"text": "`arrivalsCount`, `departuresCount`, `jobDelay`, and `avgDelay`", "case": "C2", "polarity": "agrees"}, {"text": ", if $\\mu$-a.s. "}, {"text": "$\\liminf_{t\\to\\infty} N(t)/t \\ge \\lambda_{\\min} > 0$ in `EReal`", "case": "C5", "polarity": "agrees"}, {"text": " and "}, {"text": "`Tendsto departuresCount atTop atTop`", "case": "C6", "polarity": "agrees"}, {"text": ", then $\\mu$-a.s. "}, {"text": "$\\limsup_{t\\to\\infty} \\mathrm{avgDelay}(t) \\le |B| / \\lambda_{\\min}$ in `EReal`", "case": "C7", "polarity": "agrees"}, {"text": "."}]}, "defaults": [{"construct": "HDiv.hDiv", "type": "ℝ", "constant": "LifoBackpressure.Statements.BufferSystem.avgDelay", "file": "Statements/Little.lean", "line": 75, "meaning": "", "status": "justified", "explanation": "In avgDelay, division by departuresCount t defaults to 0 when departuresCount t = 0, but the a.s. hypothesis Tendsto departuresCount atTop atTop guarantees departuresCount t > 0 for all sufficiently large t, so the Filter.limsup tail never divides by zero."}, {"construct": "HSub.hSub", "type": "ℕ", "constant": "LifoBackpressure.Statements.BufferSystem.jobDelay", "file": "Statements/Little.lean", "line": 65, "meaning": "", "status": "justified", "explanation": "In jobDelay, Nat subtraction d - arrival k never truncates because BufferSystem.arrival_le_depart enforces arrival k <= d whenever depart k = some d."}, {"construct": "HDiv.hDiv", "type": "EReal", "constant": "LifoBackpressure.Statements.Theorem1Statement", "file": "Statements/Little.lean", "line": 93, "meaning": "", "status": "justified", "explanation": "In Theorem1Statement, EReal division arrivalsCount t / t at t = 0 does not affect Filter.liminf along Filter.atTop, since every t >= 1 has nonzero denominator."}, {"construct": "HDiv.hDiv", "type": "ℝ", "constant": "LifoBackpressure.Statements.Theorem1Statement", "file": "Statements/Little.lean", "line": 93, "meaning": "", "status": "justified", "explanation": "In Theorem1Statement, real division (Fintype.card B : ℝ) / lamMin never divides by zero because 0 < lamMin is an explicit hypothesis."}], "lamport": {"provenance": "Follows Appendix A of arXiv:1008.4895v2 (L1019–1080), adapted to discrete slotted time $t \\in \\mathbb{N}$.", "statement": "Let $\\mathcal{B}$ be a finite set of single-occupancy LIFO buffer locations. Suppose w.p. 1 that $\\liminf_{t\\to\\infty} N(t)/t \\ge \\lambda_{\\min} > 0$ and $\\lim_{t\\to\\infty} D(t) = \\infty$. Then w.p. 1, $\\limsup_{t\\to\\infty} \\frac{1}{D(t)}\\sum_{i=1}^{D(t)} W_i \\le |\\mathcal{B}| / \\lambda_{\\min}$.", "groups": [{"id": "⟨1⟩1", "title": "Restrict to an almost-sure sample path", "steps": [{"id": "⟨1⟩1.⟨2⟩1", "title": "Fix a good sample path $\\omega$", "body": "Fix a sample path $\\omega$ on which both $\\liminf_{t\\to\\infty} N(t)/t \\ge \\lambda_{\\min}$ and $D(t) \\to \\infty$ hold. The intersection of these two probability-1 events has probability 1.", "uses": ["Theorem 1 hypotheses"], "lean": "Proofs.Little.theorem1_pathwise"}]}, {"id": "⟨1⟩2", "title": "Total delay upper bound ($\\sum_{i=1}^{D(t)} W_i \\le |\\mathcal{B}| \\cdot t$)", "steps": [{"id": "⟨1⟩2.⟨2⟩1", "title": "Disjoint occupancy intervals per slot", "body": "For each buffer slot $b \\in \\mathcal{B}$, single occupancy ensures any two distinct jobs assigned to $b$ have disjoint residency intervals $[a_k, d_k)$.", "uses": ["BufferSystem.disjoint_slots"], "lean": "Proofs.Little.slot_delay_le"}, {"id": "⟨1⟩2.⟨2⟩2", "title": "Per-slot departing delay $\\le t$", "body": "Every job departing by time $t$ ($d_k \\le t$) satisfies $[a_k, d_k) \\subseteq \\{0, \\dots, t-1\\}$, so $\\sum_{k:\\,\\mathrm{slot}(k)=b,\\, d_k \\le t} W_k \\le t$ (discrete analogue of Eq. 23 & Fig. 14).", "uses": ["⟨1⟩2.⟨2⟩1"], "lean": "Proofs.Little.slot_delay_le"}, {"id": "⟨1⟩2.⟨2⟩3", "title": "Sum over all $b \\in \\mathcal{B}$", "body": "Summing over all $b \\in \\mathcal{B}$ gives $\\sum_{k:\\, d_k \\le t} W_k \\le |\\mathcal{B}| \\cdot t$ for every $t \\in \\mathbb{N}$ directly, avoiding Appendix A's split into $\\tilde{\\mathcal{B}}$ and finite remainder $\\mathcal{J}$.", "uses": ["⟨1⟩2.⟨2⟩2"], "lean": "Proofs.Little.totalDelay_le"}]}, {"id": "⟨1⟩3", "title": "Departure lower bound ($D(t) \\ge N(t) - |\\mathcal{B}|$)", "steps": [{"id": "⟨1⟩3.⟨2⟩1", "title": "Undeparted arrivals occupy distinct slots at time $t$", "body": "Every job arriving before $t$ ($a_k < t$) that has not departed by $t$ ($d_k > t$) occupies its assigned slot $\\mathrm{slot}(k) \\in \\mathcal{B}$ at slot $t$.", "uses": ["BufferSystem.disjoint_slots"], "lean": "Proofs.Little.arrivals_le_departures_add_card"}, {"id": "⟨1⟩3.⟨2⟩2", "title": "At most $|\\mathcal{B}|$ jobs remain in buffer", "body": "Injectivity of $\\mathrm{slot}$ on undeparted jobs yields $|\\{k : a_k < t < d_k\\}| \\le |\\mathcal{B}|$, hence $N(t) \\le D(t) + |\\mathcal{B}|$ and $D(t) \\ge N(t) - |\\mathcal{B}|$.", "uses": ["⟨1⟩3.⟨2⟩1"], "lean": "Proofs.Little.arrivals_le_departures_add_card"}]}, {"id": "⟨1⟩4", "title": "Asymptotic $\\limsup$ conclusion", "steps": [{"id": "⟨1⟩4.⟨2⟩1", "title": "Eventual ratio bound for any $\\varepsilon \\in (0, \\lambda_{\\min})$", "body": "Since $\\liminf N(t)/t \\ge \\lambda_{\\min}$ and $|\\mathcal{B}|/t \\to 0$, eventually $D(t)/t \\ge \\lambda_{\\min} - \\varepsilon > 0$. Combining ⟨1⟩2.⟨2⟩3 and ⟨1⟩3.⟨2⟩2 yields $\\mathrm{avgDelay}(t) \\le |\\mathcal{B}| t / D(t) \\le |\\mathcal{B}| / (\\lambda_{\\min} - \\varepsilon)$.", "uses": ["⟨1⟩1.⟨2⟩1", "⟨1⟩2.⟨2⟩3", "⟨1⟩3.⟨2⟩2"], "lean": "Proofs.Little.theorem1"}, {"id": "⟨1⟩4.⟨2⟩2", "title": "Send $\\varepsilon \\to 0^+$ (Q.E.D.)", "body": "Taking $\\limsup_{t\\to\\infty}$ and letting $\\varepsilon \\to 0^+$ yields $\\limsup_{t\\to\\infty} \\mathrm{avgDelay}(t) \\le |\\mathcal{B}| / \\lambda_{\\min}$ almost surely. $\\blacksquare$", "uses": ["⟨1⟩4.⟨2⟩1"], "lean": "Assembly.theorem_little1"}]}]}}, {"id": "theorem:qla-markovian", "short_id": "Thm 2", "reference": "Theorem 2", "title": "$[O(1/V), O(V)]$ Utility-Delay Tradeoff Under Markov Dynamics", "page": 5, "paper_loc": "Section VI-C (L540–549); cites companion arXiv:1008.0200v1", "proof_origin": "Companion paper arXiv:1008.0200v1 (proved from scratch via Poisson route)", "basis": "lean", "basis_label": "Lean-only proof route (Poisson equation)", "distilled": true, "loc": 1982, "defs": 61, "thms": 78, "witness": "LifoBackpressure.Examples.theorem2_witness", "witness_file": "lean/Examples/NetworkWitnesses.lean", "witness_note": "2-action stochastic network model verifying slackness, Backpressure rule, and stability.", "plain_english": "Standard Backpressure (MaxWeight) routing and scheduling doesn't care whether you serve packets FIFO or LIFO—the queue *sizes* evolve identically. This theorem guarantees that even when network channels and traffic states evolve as a correlated finite-state Markov chain $S(t)$ (not just i.i.d.), tuning the single control knob $V \\ge 1$ pushes average operating cost within $O(1/V)$ of the best possible stable policy—including clairvoyant policies—while keeping average total queue backlog bounded by $O(V)$.", "proof_sketch": "While the companion paper [17] uses variable renewal return times and Carathéodory strong duality, our Lean formalization takes a cleaner, self-contained route: we prove finite-state irreducibility and aperiodicity imply Doeblin $L^1$ geometric mixing (`Routine/MarkovMixing.lean`), solve Poisson's equation for the state-dependent dual function, and telescope a perturbed quadratic Lyapunov function $L(t) + h(q(t), S(t))$. Pairing this with a 10-line elementary weak-duality inequality yields both $O(V)$ stability and $f^*_{av} + O(1/V)$ optimality uniformly in $V \\ge 1$.", "paper_statement_html": "Suppose $S(t)$ is a finite-state irreducible and aperiodic Markov chain and the $\\eta$-slackness condition (2) holds. Then Backpressure (with either FIFO or LIFO) achieves $$f_{av}^{BP} = f_{av}^* + O(1/V), \\qquad \\overline{q}^{BP} = O(V),$$ where $f_{av}^{BP}$ and $\\overline{q}^{BP}$ are the expected time-average cost and backlog under Backpressure.", "paper_tex": "\\begin{thm}\\label{theorem:qla-markovian}\nSuppose $S(t)$ is a finite state irreducible and aperiodic Markov chain\\footnote{In \\cite{huangneely_qlamarkovian}, the theorem is proven under more general Markovian $S(t)$ processes that include the $S(t)$ process assumed here.}  and condition (\\ref{eq:slackness}) holds, Backpressure (with either FIFO or LIFO) achieves the following:\n\\begin{eqnarray}\nf_{av}^{BP}=f^*_{av} + O(1/V), \\,\\, \\overline{q}^{BP} = O(V), \n\\end{eqnarray}\nwhere $f_{av}^{BP}$ and $\\overline{q}^{BP}$ are the expected time average cost and  backlog under Backpressure. \n\\end{thm}\n\\begin{proof}\nSee \\cite{huangneely_qlamarkovian}. \n\\end{proof}", "routine_deps": ["R1", "R2"], "setup_deps": ["S2", "S3"], "witness_node": "W2", "edits": [], "declaration": "Assembly.theorem_qla_markovian", "expected": "LifoBackpressure.Statements.Theorem2Statement", "axioms": ["propext", "Classical.choice", "Quot.sound"], "sha256": "b348666c17be732d8b3d759781e05a0f5abea60ac68663865ac05ee05a3b607a", "lean_source": "import Statements.SystemModel\n\n/-!\n# Statements for Theorem 2 (`theorem:qla-markovian`): `[O(1/V), O(V)]` Tradeoff Under Markov Dynamics\n\nFormalizes Theorem 2 of `arXiv:1008.4895v2` (Section VI-C, lines 540-549; companion proof in\n`references/1008.0200v1/pure-qla-markovian-v9.tex`).\n-/\n\nnamespace LifoBackpressure.Statements\n\nopen Filter MeasureTheory\n\n/-- Paper Theorem 2 (`theorem:qla-markovian`): Under a finite-state irreducible aperiodic\nMarkovian network state process `S(t)` and `η`-slackness, Backpressure (with either FIFO or\nLIFO queueing discipline) achieves an `[O(1/V), O(V)]` utility-delay tradeoff uniformly in\n`V ≥ 1`, with constants `C_cost, C_q0, C_q1` independent of `V`. -/\ndef Theorem2Statement : Prop :=\n  ∀ (M : NetworkModel) (η : ℝ),\n    M.HasSlackness η →\n    ∃ (C_cost C_q0 C_q1 : ℝ), 0 ≤ C_cost ∧ 0 ≤ C_q0 ∧ 0 ≤ C_q1 ∧\n      ∀ (V : ℝ), 1 ≤ V →\n        ∀ (Ω : Type) [MeasurableSpace Ω] (μ : Measure Ω) [IsProbabilityMeasure μ]\n          (proc : M.MarkovProcess Ω μ) (pol : M.Policy proc),\n          pol.FollowsBackpressure V →\n          pol.IsStable ∧\n          M.optCost proc ≤ pol.avgCost ∧\n          pol.avgCost ≤ M.optCost proc + ((C_cost / V : ℝ) : EReal) ∧\n          pol.avgBacklog ≤ ((C_q0 + C_q1 * V : ℝ) : EReal)\n\nend LifoBackpressure.Statements\n", "comparison": {"result": "match", "summary": "LifoBackpressure.Statements.Theorem2Statement matches Paper Theorem 2 (theorem:qla-markovian) across all 10 numbered obligations (C1-C10), with uniform V-independent [O(1/V), O(V)] cost and backlog bounds and explicit stability. Minor modeling normalizations are cleanly recorded: NetworkModel fixes the primary nonnegative cost-minimization setting f in [0, delta_max] (omitting the parenthetical reward-maximization sign convention f in [-delta_max, 0], which reduces by shifting f by +delta_max), makes Nonempty (Action s) explicit, uses a finite convex combination in HasSlackness (equivalent to Eq. (2)'s countable series by compactness and Caratheodory's theorem), fixes deterministic state-backlog tie-breaking in FollowsBackpressure, and benchmarks against all measurable (possibly non-causal) stable policies in optCost (which strengthens the cost upper bound).", "scope": "Covers Paper Theorem 2 in full for the Section III nonnegative cost-minimization model over all V >= 1, with stronger non-causal benchmark optCost and constants uniform over initial state distributions. Reward maximization (f <= 0) reduces immediately by shifting f -> f + delta_max. All noncomputable definitions (avgBacklog, avgCost, optCost) are standard measure-theoretic expectations/infima and do not conflict with any algorithmic claim; all external packages are standard Mathlib/Lean dependencies.", "advice": "Recommend approval. Check only whether you want the parenthetical reward-maximization convention (negative costs f in [-delta_max, 0]) formalized directly rather than via the constant shift f -> f + delta_max, or non-stationary/randomized Backpressure tie-breaking.", "stronger_result": "M.optCost proc takes the infimum over all measurable (including non-causal/clairvoyant) stable policies on proc rather than only causal policies, making pol.avgCost <= M.optCost proc + C_cost / V at least as strong as the causal-policy benchmark; moreover, the constants C_cost, C_q0, C_q1 are uniform across all V >= 1, initial state distributions of S(0), probability spaces (Ω, μ), and Backpressure tie-breaking rules.", "issue": null, "cases": [{"code": "C1", "case": "C1: Slotted time and queue count r >= 1", "kind": "agrees", "polarity": "agrees", "paper": "Discrete slotted time t in N and r >= 1 queues (L281).", "lean": "Time index t : ℕ, M.r : ℕ, and M.hr : 0 < M.r.", "why": "Exact correspondence."}, {"code": "C2", "case": "C2: Finite-state irreducible aperiodic Markov chain S(t) with stationary distribution pi > 0", "kind": "agrees", "polarity": "agrees", "paper": "Finite-state irreducible aperiodic Markov chain S(t) on S = {s_1, ..., s_M} with stationary probabilities pi_{s_i} > 0 (L285-L286, L541).", "lean": "NetworkModel bundles finite nonempty decidable State, stochastic irreducible aperiodic kernel P (via matPow, Irreducible, Aperiodic), strictly positive stationary distribution π, and MarkovProcess encoding cylinder transition probabilities.", "why": "Exact formalization; bundling the unique strictly positive stationary distribution π alongside irreducible aperiodic P is equivalent by finite Markov chain theory."}, {"code": "C3", "case": "C3: Compact action sets and bounded continuous cost, arrival, and service functions", "kind": "restriction", "polarity": "gap", "paper": "Time-invariant compact (implicitly nonempty) X^(s_i), continuous time-invariant f, A_j, mu_j uniformly bounded by delta_max in (0, infinity), with f : X^(s_i) -> R_+ (or parenthetically R_- for reward maximization) (L291-L300).", "lean": "NetworkModel requires [CompactSpace (Action s)], [Nonempty (Action s)], continuity of cost, arrival, service, 0 < δmax, and 0 <= cost, arrival, service <= δmax.", "why": "Makes nonemptiness of Action s explicit and restricts to the paper's primary nonnegative cost-minimization convention f in [0, delta_max], excluding negative costs f in [-delta_max, 0] directly (though shifting f by +delta_max with bound 2*delta_max leaves Backpressure argmax and O(1/V) cost optimality unchanged)."}, {"code": "C4", "case": "C4: Queue dynamics with q(0) = 0", "kind": "agrees", "polarity": "agrees", "paper": "q_j(t+1) = max[q_j(t) - mu_j(t), 0] + A_j(t) with q(0) = 0 (L315-L319).", "lean": "Policy.queue 0 ω = 0 and Policy.queue (t+1) ω = queueNext (pol.queue t ω) (M.service ...) (M.arrival ...), where queueNext q μ A j = max (q j - μ j) 0 + A j.", "why": "Exact match to Eq. (3) and initial empty queues."}, {"code": "C5", "case": "C5: Slater eta-slackness condition (Eq. 2)", "kind": "other form", "polarity": "nuance", "paper": "Countable collection {x^(s_i)k}_{k=1..infinity} with weights theta^(s_i)_k >= 0 summing to 1 and stationary expected drift <= -eta for some eta > 0 (L300-L305, L541).", "lean": "NetworkModel.HasSlackness η uses a finite index Fin m per state with weights θ s k >= 0 summing to 1 and stationary expected drift <= -η.", "why": "Mathematically equivalent to the paper's countable series: since Action s is compact and arrival - service is continuous, its image K_s in R^r is compact, so conv(K_s) is compact and by Caratheodory's theorem every countable convex combination equals a finite convex combination of at most r + 1 actions."}, {"code": "C6", "case": "C6: Backpressure policy (Eq. 6) under FIFO or LIFO", "kind": "chosen reading", "polarity": "nuance", "paper": "At each slot t, choose x^(S(t)) maximizing -V f(s_i, x) + sum_j q_j(t) (mu_j(s_i, x) - A_j(s_i, x)), with either FIFO or LIFO queueing discipline (L430-L435, L541).", "lean": "Policy.FollowsBackpressure V pol asserts existence of a deterministic state-backlog rule choice(s, q) satisfying IsBackpressureRule V choice such that pol.act t ω = choice (proc.S t ω) (pol.queue t ω).", "why": "Matches Eq. (6) and covers both FIFO and LIFO because aggregate backlog q(t) is identical under both disciplines; fixes tie-breaking to a deterministic time-homogeneous function choice(s, q) of current state and backlog."}, {"code": "C7", "case": "C7: Definitions of avgCost, avgBacklog, stability, and optimal stable cost f_av^*", "kind": "stronger", "polarity": "stronger", "paper": "limsup expected time-average total backlog < infinity (Eq. 4), limsup expected time-average cost (Eq. 5), and optimal cost f_av^* over all feasible stable policies (L319-L337, L545).", "lean": "Policy.avgBacklog, Policy.IsStable := avgBacklog < ⊤, Policy.avgCost, and M.optCost proc := iInf over all measurable stable Policy proc (without requiring causal adaptedness).", "why": "Exact formulas for Eqs. (4)-(5). Allowing arbitrary measurable (even non-causal/clairvoyant) policies in Policy enlarges the comparison class, making M.optCost proc <= causal optCost and thereby strengthening pol.avgCost <= M.optCost proc + C_cost / V."}, {"code": "C8", "case": "C8: Control parameter V >= 1 and V-independence of O(1/V) and O(V) constants", "kind": "agrees", "polarity": "agrees", "paper": "O(1/V) and O(V) tradeoff constants independent of V >= 1 (L101, L149, L543).", "lean": "Existential constants C_cost, C_q0, C_q1 >= 0 are quantified outside ∀ V, 1 ≤ V → and outside ∀ Ω μ proc pol.", "why": "Captures exact V-independence over V >= 1, plus uniformity over initial state distributions and probability spaces."}, {"code": "C9", "case": "C9: Cost optimality bound f_av^* <= f_av^BP <= f_av^* + C_cost / V", "kind": "agrees", "polarity": "agrees", "paper": "f_av^BP = f_av^* + O(1/V) (L543), i.e., f_av^* <= f_av^BP <= f_av^* + C_1 / V.", "lean": "M.optCost proc ≤ pol.avgCost ∧ pol.avgCost ≤ M.optCost proc + ((C_cost / V : ℝ) : EReal).", "why": "Exact two-sided O(1/V) cost optimality bound."}, {"code": "C10", "case": "C10: Backlog bound O(V) and stability", "kind": "agrees", "polarity": "agrees", "paper": "q_bar^BP = O(V) and Backpressure is stable (L543, L320-L323).", "lean": "pol.IsStable ∧ pol.avgBacklog ≤ ((C_q0 + C_q1 * V : ℝ) : EReal).", "why": "Exact match: for V >= 1, C_q0 + C_q1 * V <= (C_q0 + C_q1) * V, giving q_bar^BP = O(V) and explicit finiteness pol.avgBacklog < ⊤."}], "counts": {"agrees": 6, "stronger": 1, "nuance": 2, "gap": 1}, "paper_spans": [{"text": "In "}, {"text": "discrete slotted time with $r \\ge 1$ queues", "case": "C1", "polarity": "agrees"}, {"text": " and a "}, {"text": "finite-state irreducible aperiodic Markov chain $S(t)$ (stationary $\\pi > 0$)", "case": "C2", "polarity": "agrees"}, {"text": ", with "}, {"text": "compact $\\mathcal{X}^{(s_i)}$ and $\\delta_{\\max}$-bounded continuous $f \\ge 0$ (or parenthetically $f \\le 0$ for reward), $A_j, \\mu_j$", "case": "C3", "polarity": "gap"}, {"text": ", "}, {"text": "queue dynamics $q_j(t+1) = \\max[q_j(t) - \\mu_j(t), 0] + A_j(t)$ with $q(0) = 0$", "case": "C4", "polarity": "agrees"}, {"text": ", and "}, {"text": "countable Slater $\\eta$-slackness (Eq. 2)", "case": "C5", "polarity": "nuance"}, {"text": ": under "}, {"text": "Backpressure Eq. (6) (FIFO or LIFO)", "case": "C6", "polarity": "nuance"}, {"text": " with "}, {"text": "$V \\ge 1$ ($V$-independent constants)", "case": "C8", "polarity": "agrees"}, {"text": ", compared against "}, {"text": "the optimal cost $f^*_{av}$ over all feasible causal stable policies", "case": "C7", "polarity": "stronger"}, {"text": ", Backpressure achieves "}, {"text": "$f^{BP}_{av} = f^*_{av} + O(1/V)$", "case": "C9", "polarity": "agrees"}, {"text": " and "}, {"text": "stability with $\\overline{q}^{BP} = O(V)$", "case": "C10", "polarity": "agrees"}, {"text": "."}], "lean_spans": [{"text": "For any `NetworkModel M` with "}, {"text": "$M.r > 0$ queues and time $t \\in \\mathbb{N}$", "case": "C1", "polarity": "agrees"}, {"text": ", "}, {"text": "finite irreducible aperiodic Markov kernel $P$ with $\\pi > 0$", "case": "C2", "polarity": "agrees"}, {"text": ", "}, {"text": "explicitly `Nonempty` compact `Action s` and nonnegative `cost` $\\in [0, \\delta_{\\max}]$", "case": "C3", "polarity": "gap"}, {"text": ", "}, {"text": "`queueNext` dynamics with `queue 0 = 0`", "case": "C4", "polarity": "agrees"}, {"text": ", and "}, {"text": "finite-mixture `HasSlackness η` (equivalent via Carathéodory)", "case": "C5", "polarity": "nuance"}, {"text": ": there exist "}, {"text": "$V$-, $(\\Omega,\\mu)$-, and initial-state-independent $C_{\\mathrm{cost}}, C_{q0}, C_{q1} \\ge 0$", "case": "C8", "polarity": "agrees"}, {"text": " such that for all $V \\ge 1$ and every policy with "}, {"text": "deterministic state-backlog tie-breaking `FollowsBackpressure V`", "case": "C6", "polarity": "nuance"}, {"text": ", benchmarking against "}, {"text": "`optCost` over ALL measurable (even non-causal/clairvoyant) stable policies", "case": "C7", "polarity": "stronger"}, {"text": ", we have "}, {"text": "$f^*_{av} \\le f^{BP}_{av} \\le f^*_{av} + C_{\\mathrm{cost}}/V$", "case": "C9", "polarity": "agrees"}, {"text": " and "}, {"text": "`pol.IsStable` with $\\overline{q}^{BP} \\le C_{q0} + C_{q1} V$", "case": "C10", "polarity": "agrees"}, {"text": "."}]}, "defaults": [{"construct": "ENNReal.ofReal", "type": "", "constant": "LifoBackpressure.Statements.NetworkModel.MarkovProcess.mk", "file": "Statements/SystemModel.lean", "line": 124, "meaning": "", "status": "justified", "explanation": "In MarkovProcess.mk, ENNReal.ofReal is only applied to M.P s s', which is guaranteed nonnegative by M.P_nonneg."}, {"construct": "HDiv.hDiv", "type": "EReal", "constant": "LifoBackpressure.Statements.NetworkModel.Policy.avgBacklog", "file": "Statements/SystemModel.lean", "line": 150, "meaning": "", "status": "justified", "explanation": "In Policy.avgBacklog, EReal division 1 / t at t = 0 does not affect Filter.limsup along Filter.atTop, since every t >= 1 has nonzero denominator."}, {"construct": "MeasureTheory.integral", "type": "", "constant": "LifoBackpressure.Statements.NetworkModel.Policy.avgBacklog", "file": "Statements/SystemModel.lean", "line": 150, "meaning": "", "status": "justified", "explanation": "In Policy.avgBacklog, pol.queue τ ω j is measurable by induction from Policy.measurable_arrival and measurable_service and uniformly bounded in [0, τ * M.δmax], hence Bochner integrable on the probability space (Ω, μ)."}, {"construct": "HDiv.hDiv", "type": "EReal", "constant": "LifoBackpressure.Statements.NetworkModel.Policy.avgCost", "file": "Statements/SystemModel.lean", "line": 166, "meaning": "", "status": "justified", "explanation": "In Policy.avgCost, EReal division 1 / t at t = 0 does not affect Filter.limsup along Filter.atTop, since every t >= 1 has nonzero denominator."}, {"construct": "MeasureTheory.integral", "type": "", "constant": "LifoBackpressure.Statements.NetworkModel.Policy.avgCost", "file": "Statements/SystemModel.lean", "line": 166, "meaning": "", "status": "justified", "explanation": "In Policy.avgCost, M.cost (proc.S τ ω) (pol.act τ ω) is measurable by Policy.measurable_cost and uniformly bounded in [0, M.δmax], hence Bochner integrable on the probability space (Ω, μ)."}, {"construct": "iInf", "type": "", "constant": "LifoBackpressure.Statements.NetworkModel.optCost", "file": "Statements/SystemModel.lean", "line": 176, "meaning": "", "status": "justified", "explanation": "M.optCost is valued in the complete lattice EReal (not ℝ), the set of stable policies is nonempty under HasSlackness (witnessed by Backpressure itself), and every policy has avgCost >= 0 because M.cost >= 0, so the infimum is finite and well-defined."}, {"construct": "HDiv.hDiv", "type": "ℝ", "constant": "LifoBackpressure.Statements.Theorem2Statement", "file": "Statements/MarkovTradeoff.lean", "line": 14, "meaning": "", "status": "justified", "explanation": "In Theorem2Statement, real division C_cost / V never divides by zero because 1 <= V is an explicit hypothesis."}], "lamport": {"provenance": "Lean-only proof route (`basis: lean`). Manuscript cites arXiv:1008.0200v1 (variable return-time drift + Carathéodory strong duality). Lean proves the exact same Theorem 2 directly via finite-Markov Doeblin mixing, Poisson's equation, and elementary weak duality — avoiding renewal stopping times.", "statement": "Under finite-state irreducible aperiodic $S(t)$ and $\\eta$-slackness, there exist $V$-independent $C_{\\mathrm{cost}}, C_{q0}, C_{q1} \\ge 0$ such that for all $V \\ge 1$, Backpressure is stable and achieves $f^*_{av} \\le f^{BP}_{av} \\le f^*_{av} + C_{\\mathrm{cost}}/V$ and $\\overline{q}^{BP} \\le C_{q0} + C_{q1} V$.", "groups": [{"id": "⟨1⟩1", "title": "Geometric mixing & Poisson's equation for finite Markov chain $S(t)$", "steps": [{"id": "⟨1⟩1.⟨2⟩1", "title": "Primitivity from irreducibility + aperiodicity", "body": "By Schur's additive submonoid theorem on finite `State`, irreducibility and aperiodicity imply $P$ is primitive: $\\exists m > 0,\\, \\forall s, s',\\, P^m(s, s') > 0$.", "uses": ["Routine.MarkovMixing.exists_matPow_pos"], "lean": "Routine.MarkovMixing.exists_matPow_pos"}, {"id": "⟨1⟩1.⟨2⟩2", "title": "Doeblin $L^1$ geometric mixing", "body": "Doeblin contraction gives $C_{\\mathrm{mix}}, \\rho \\in (0, 1)$ (depending only on $P$) with $\\sum_{s'} |P^n(s,s') - \\pi_{s'}| \\le C_{\\mathrm{mix}} \\rho^n$, so $C' := \\sum_{n=0}^\\infty \\sup_s \\sum_{s'} |P^n(s,s') - \\pi_{s'}| < \\infty$.", "uses": ["⟨1⟩1.⟨2⟩1"], "lean": "Routine.MarkovMixing.exists_geometric_mixing"}, {"id": "⟨1⟩1.⟨2⟩3", "title": "Lipschitz Poisson potential $h(V, \\gamma, s)$", "body": "Define $h(V,\\gamma,s) := \\sum_{n=0}^\\infty \\sum_{s'} (P^n(s,s') - \\pi_{s'}) g_{s'}(V,\\gamma)$. It solves $g_s - g = h(s) - (Ph)(s)$, is $(C'B)$-Lipschitz in $\\gamma$ ($B = \\sqrt{r}\\delta_{\\max}$), and satisfies $|h(V,\\gamma,s)| \\le C'(V\\delta_{\\max} + B\\|\\gamma\\|)$.", "uses": ["⟨1⟩1.⟨2⟩2"], "lean": "Routine.MarkovMixing.poisson_equation"}]}, {"id": "⟨1⟩2", "title": "Elementary weak duality ($g(V, \\gamma) \\le V f^*_{av}$ for all $\\gamma \\succeq 0$)", "steps": [{"id": "⟨1⟩2.⟨2⟩1", "title": "Per-slot dual lower bound for any policy $\\Pi$", "body": "For any measurable stable policy $\\Pi$ and $\\gamma \\succeq 0$, $g_{S(\\tau)}(V,\\gamma) \\le V f^\\Pi(\\tau) + \\sum_j \\gamma_j (A_j^\\Pi(\\tau) - \\mu_j^\\Pi(\\tau))$, and Eq. (3) gives $A_j^\\Pi - \\mu_j^\\Pi \\le q_j^\\Pi(\\tau+1) - q_j^\\Pi(\\tau)$.", "uses": ["Eq. (3) dynamics", "dualState def"], "lean": "Proofs.MarkovTradeoff.dual_le_V_mul_avgCost"}, {"id": "⟨1⟩2.⟨2⟩2", "title": "Cesàro subsequence eliminates boundary queue term", "body": "Summing over $\\tau < t$ and taking expectations gives $\\frac{1}{t}\\sum_{\\tau<t}\\mathbb{E}[g_{S(\\tau)}] \\le V \\cdot \\frac{1}{t}\\sum_{\\tau<t}\\mathbb{E}[f^\\Pi] + \\frac{1}{t}\\sum_j \\gamma_j \\mathbb{E}[q_j^\\Pi(t)]$. Stability forces $\\liminf_{t\\to\\infty} \\mathbb{E}[q_j^\\Pi(t)]/t = 0$, yielding $g(V,\\gamma) \\le V f^*_{av}$.", "uses": ["⟨1⟩2.⟨2⟩1", "Routine.BackpressureDrift.exists_small_ratio_of_avg_limsup_lt_top"], "lean": "Proofs.MarkovTradeoff.dual_le_V_mul_optCost"}]}, {"id": "⟨1⟩3", "title": "One-slot Lyapunov drift + Poisson telescoping", "steps": [{"id": "⟨1⟩3.⟨2⟩1", "title": "Quadratic drift under Backpressure", "body": "For $L(t) = \\frac{1}{2}\\sum_j q_j(t)^2$, Eq. (3) and Eq. (6) optimality yield $L(t+1) - L(t) + V f^{BP}(t) \\le B^2 + g_{S(t)}(V, q(t))$.", "uses": ["Routine.BackpressureDrift.sum_quad_drift", "FollowsBackpressure"], "lean": "Proofs.MarkovTradeoff.bp_one_slot_drift"}, {"id": "⟨1⟩3.⟨2⟩2", "title": "Telescope perturbed Lyapunov function $L(t) + h(q(t), S(t))$", "body": "Substituting Poisson's equation and using $|h(q(t+1), S(t+1)) - h(q(t), S(t+1))| \\le C'B^2$ gives $\\mathbb{E}[L(t+1)+h_{t+1}] - \\mathbb{E}[L(t)+h_t] + V\\mathbb{E}[f^{BP}(t)] \\le (1+C')B^2 + \\mathbb{E}[g(V, q(t))]$. Completing the square bounds $L(T) + h_T$ uniformly below.", "uses": ["⟨1⟩1.⟨2⟩3", "⟨1⟩3.⟨2⟩1"], "lean": "Proofs.MarkovTradeoff.perturbed_lyapunov_telescope"}]}, {"id": "⟨1⟩4", "title": "Conclude $[O(1/V), O(V)]$ bounds (Q.E.D.)", "steps": [{"id": "⟨1⟩4.⟨2⟩1", "title": "$O(V)$ backlog & stability from $\\eta$-slackness", "body": "Using $g(V, q) \\le V\\delta_{\\max} - \\eta\\sum_j q_j$ yields $\\overline{q}^{BP} \\le ((1+C')B^2 + V\\delta_{\\max})/\\eta = O(V)$ and stability.", "uses": ["⟨1⟩3.⟨2⟩2", "HasSlackness"], "lean": "Proofs.MarkovTradeoff.theorem2"}, {"id": "⟨1⟩4.⟨2⟩2", "title": "$O(1/V)$ cost optimality from weak duality (Q.E.D.)", "body": "Using $g(V, q) \\le V f^*_{av}$ (⟨1⟩2.⟨2⟩2) yields $f^{BP}_{av} \\le f^*_{av} + (1+C')B^2/V$, while stability gives $f^*_{av} \\le f^{BP}_{av}$. $\\blacksquare$", "uses": ["⟨1⟩2.⟨2⟩2", "⟨1⟩3.⟨2⟩2", "⟨1⟩4.⟨2⟩1"], "lean": "Assembly.theorem_qla_markovian"}]}]}}, {"id": "thm:prob_multi_con", "short_id": "Thm 3", "reference": "Theorem 3", "title": "Exponential Attraction of Queue Backlogs to the Dual Optimum", "page": 5, "paper_loc": "Section VI-C (L553–570); cites companion arXiv:0904.3795v1", "proof_origin": "Companion paper arXiv:0904.3795v1 (proved from scratch in Lean)", "basis": "aligned", "basis_label": "Aligned with companion proof [9]", "distilled": true, "loc": 2866, "defs": 78, "thms": 87, "witness": "LifoBackpressure.Examples.theorem3_witness", "witness_file": "lean/Examples/NetworkWitnesses.lean", "witness_note": "2-action model verifying unique dual optimum $\\gamma_V^*$ and polyhedral slope $L > 0$.", "plain_english": "Theorem 2 says Backpressure queues sit at height $\\Theta(V)$, which sounds terrible for delay—unless the queues stay tightly clustered around a single point! Theorem 3 proves that when the dual objective has a unique, sharply peaked (\"polyhedral\") optimum $\\boldsymbol{\\gamma}_V^*$, the queue vector is **exponentially attracted** to $\\boldsymbol{\\gamma}_V^*$: the fraction of time *any* queue wanders more than distance $D + Km$ away from $\\gamma_{Vj}^*$ decays exponentially fast as $c^* e^{-m}$, with constants $D, K, c^*$ completely independent of $V$.", "proof_sketch": "Because Backpressure choices form a subgradient of the state-wise dual function $g_{S(t)}$, the squared Euclidean distance $\\|q(t) - \\gamma_V^*\\|^2$ drifts downward whenever we average over a $V$-independent mixing window $T_\\nu$ (from Doeblin mixing in `Routine/MarkovMixing.lean`). Combined with the polyhedral dual slope $L > 0$, Euclidean distance $Y(t) = \\|q(t) - \\gamma_V^*\\|$ enjoys strict linear negative drift $-\\eta_d$ outside a constant radius $D$. Applying a Padé exponential bound (`Routine/BackpressureDrift.lean`) to $e^{w\\max(Y(t)-D,0)}$ and telescoping yields a uniform exponential moment bound $c^*$, from which Markov's inequality produces $c^* e^{-m}$.", "paper_statement_html": "Suppose $\\boldsymbol{\\gamma}_V^*$ is unique, $\\eta$-slackness (2) holds, and $g(\\boldsymbol{\\gamma}_V^*) \\ge g(\\boldsymbol{\\gamma}) + L\\|\\boldsymbol{\\gamma}_V^* - \\boldsymbol{\\gamma}\\|$ for all $\\boldsymbol{\\gamma} \\succeq 0$ ($L > 0$ independent of $V$). Then there exist $V$-independent constants $D, K, c^* = \\Theta(1)$ such that for any $m \\in \\mathbb{R}_+$, $$\\mathcal{P}^{(r)}(D, Km) \\triangleq \\limsup_{t\\to\\infty}\\frac{1}{t}\\sum_{\\tau=0}^{t-1} \\Pr\\{\\exists j,\\, |q_j(\\tau) - \\gamma_{Vj}^*| > D + Km\\} \\le c^* e^{-m}.$$", "paper_tex": "\\begin{thm}\\label{thm:prob_multi_con}\nSuppose that $\\bv{\\gamma}^*_V$ is unique,  that the slackness condition (\\ref{eq:slackness}) holds, and that  the dual function $g(\\bv{\\gamma})$ satisfies:\n\\begin{eqnarray}\ng(\\bv{\\gamma}^*_V)\\geq g(\\bv{\\gamma})+L||\\bv{\\gamma}^*_V-\\bv{\\gamma}||\\quad\\forall\\,\\,\\bv{\\gamma}\\succeq\\bv{0}\\label{eq:dualpolyhedralcond},\n\\end{eqnarray}\nfor some constant $L>0$ independent of $V$. Then under Backpressure with FIFO or LIFO, there exist constants $D, K, c^*=\\Theta(1)$, i.e., all independent of $V$, such that for any $m\\in \\mathbb{R}_+$, \n\\begin{eqnarray}\n\\script{P}^{(r)}(D, Km)&\\leq& c^*e^{-m},\\label{eq:prob_pmr_special}\n\\end{eqnarray}\nwhere $\\script{P}^{(r)}(D, Km)$ is defined:\n\\begin{eqnarray}\n\\hspace{-.3in}&&\\script{P}^{(r)}(D, Km)\\label{eq:pmr_def}\\\\\n\\hspace{-.3in}&&\\qquad\\quad\\triangleq\\limsup_{t\\rightarrow\\infty}\\frac{1}{t}\\sum_{\\tau=0}^{t-1}\\prob\\{\\exists\\, j, |q_j(\\tau)-\\gamma_{Vj}^*|>D+Km\\}.\\nonumber\n\\end{eqnarray}\n\\end{thm}\n\\begin{proof}\nSee \\cite{huangneely_dr_tac}. \n\\end{proof}", "routine_deps": ["R1", "R2"], "setup_deps": ["S2", "S3", "S4"], "witness_node": "W2", "edits": ["thm3-v-lower-bound"], "declaration": "Assembly.thm_prob_multi_con", "expected": "LifoBackpressure.Statements.Theorem3Statement", "axioms": ["propext", "Classical.choice", "Quot.sound"], "sha256": "bb7fe276932c5aae2b8188ae8545330ae9a60395e21d46b0b50db7a4d66ee5d8", "lean_source": "import Statements.SystemModel\n\n/-!\n# Statements for Theorem 3 (`thm:prob_multi_con`): Exponential Attraction of Queue Backlogs\n\nFormalizes Theorem 3 of `arXiv:1008.4895v2` (Section VI-C, lines 553-570; companion proof in\n`references/0904.3795v1/delay_reduction_tr_v8_Markovian.tex`).\n-/\n\nnamespace LifoBackpressure.Statements\n\nopen Filter MeasureTheory\n\n/-- Time-average probability `P^(r)(D, offset)` from Eq. (14) that at least one queue `j`\ndeviates from `γ*_Vj` by strictly more than `D + offset`. -/\nnoncomputable def deviationProb {M : NetworkModel} {Ω : Type} [MeasurableSpace Ω]\n    {μ : Measure Ω} [IsProbabilityMeasure μ] {proc : M.MarkovProcess Ω μ}\n    (pol : M.Policy proc) (γstar : Fin M.r → ℝ) (D offset : ℝ) : EReal :=\n  Filter.limsup\n    (fun t : ℕ =>\n      (((1 : ℝ) / (t : ℝ)) *\n        ∑ τ ∈ Finset.range t,\n          (μ {ω | ∃ j : Fin M.r, D + offset < |pol.queue τ ω j - γstar j|}).toReal : EReal))\n    Filter.atTop\n\n/-- Paper Theorem 3 (`thm:prob_multi_con`): Exponential attraction of the Backpressure queue\nvector to the unique dual optimum `γ*_V` under `η`-slackness and the `V`-independent polyhedral\ndual growth condition `g(γ*_V) ≥ g(γ) + L ‖γ*_V - γ‖`. Constants `D, K, c* > 0` are independent\nof `V ≥ 1` and `m ≥ 0`. -/\ndef Theorem3Statement : Prop :=\n  ∀ (M : NetworkModel) (η L : ℝ),\n    M.HasSlackness η →\n    0 < L →\n    ∃ (D K cstar : ℝ), 0 < D ∧ 0 < K ∧ 0 < cstar ∧\n      ∀ (V : ℝ), 1 ≤ V →\n        ∀ (γstar : Fin M.r → ℝ),\n          M.IsUniqueDualOpt V γstar →\n          M.DualPolyhedral V γstar L →\n          ∀ (Ω : Type) [MeasurableSpace Ω] (μ : Measure Ω) [IsProbabilityMeasure μ]\n            (proc : M.MarkovProcess Ω μ) (pol : M.Policy proc),\n            pol.FollowsBackpressure V →\n            ∀ m : ℝ, 0 ≤ m →\n              deviationProb pol γstar D (K * m) ≤ ((cstar * Real.exp (-m) : ℝ) : EReal)\n\nend LifoBackpressure.Statements\n", "comparison": {"result": "match", "summary": "LifoBackpressure.Statements.Theorem3Statement matches Paper Theorem 3 (thm:prob_multi_con) across all 9 numbered obligations (C1-C9), preserving the exact quantifier order (V- and m-independent D, K, c* > 0 for V-independent L > 0), exact Euclidean polyhedral dual growth condition, and exact EReal exponential deviation probability bound. Minor explicitness refinements are recorded: NetworkModel fixes nonnegative costs f in [0, delta_max] and explicit Nonempty (Action s), HasSlackness uses an equivalent finite convex combination, FollowsBackpressure fixes deterministic state-backlog tie-breaking, and Lean explicitly assumes 1 <= V (implicit in Theorem 3's display, explicit in Theorem 4 L611).", "scope": "Covers Paper Theorem 3 in full for all V >= 1 under the Section III nonnegative-cost model. Explicit 1 <= V aligns with Theorem 4 and is a candidate minor clarification for the manuscript's Theorem 3 statement. All noncomputable definitions (dual, dualState, eucDist, deviationProb) are classical analysis/measure-theory quantities without any algorithmic conflict; all external dependencies are standard Mathlib/Lean packages.", "advice": "Recommend approval. Optionally consider adding the explicit range V >= 1 (or V > 0) to Theorem 3 in the manuscript so it matches Theorem 4 L611.", "stronger_result": null, "issue": null, "cases": [{"code": "C1", "case": "C1: Section III stochastic network model", "kind": "restriction", "polarity": "gap", "paper": "Finite-state irreducible aperiodic Markov chain S(t), compact X^(s_i), delta_max-bounded continuous f, A_j, mu_j (with parenthetical R_- reward note), queue dynamics Eq. (3) with
